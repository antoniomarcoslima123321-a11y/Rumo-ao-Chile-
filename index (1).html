  --good-fg: #5BD686; --good-bg: #12301E; --warn-fg: #F2B94B; --warn-bg: #3A2B0B;
  --bad-fg: #FF9A9A; --bad-bg: #3D1717; --info-fg: #8CCBF5; --info-bg: #12304A;

}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {

}

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
svg { display: block; }

.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 560px; margin: 0 auto; width: 100%; }
.num { font-variant-numeric: tabular-nums; }

/* cabeçalho */
#top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); }
.top-inner { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; font: 700 18px/1 var(--f-display); letter-spacing: -.01em; }
.brand svg { flex: none; border-radius: 3px; box-shadow: 0 0 0 1px var(--line); }
.brand span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stepper { display: flex; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; }
.stepper button { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 999px; color: var(--ink-2); }
.stepper button:disabled { opacity: .3; cursor: default; }
.stepper .mlabel { width: auto; padding: 0 6px; font-weight: 600; font-size: 14px; color: var(--ink); min-width: 78px; }

main { padding-top: 4px; padding-bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }
main > .wrap { display: flex; flex-direction: column; gap: 14px; }

/* cartões */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; min-width: 0; }
.card.lift { box-shadow: var(--shadow); }
.card h2 { margin: 0 0 10px; font: 600 13px/1.2 var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.card h3 { margin: 0; font: 700 17px/1.25 var(--f-display); }
.sub { color: var(--ink-2); font-size: 13px; }
.muted { color: var(--muted); }
.row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); min-width: 0; }
.row:first-of-type { border-top: 0; }
.row .l { min-width: 0; }
.row .l small { display: block; color: var(--muted); font-size: 12.5px; }
.row .v { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; text-align: right; }
.row.total { border-top: 2px solid var(--ink); margin-top: 4px; padding-top: 12px; }
.row.total .v { font: 700 22px/1.1 var(--f-display); }
.row.total .l { font-weight: 600; }
.neg { color: var(--bad-fg); }

/* viagem */
.hero { cursor: pointer; text-align: left; width: 100%; display: block; }
.hero-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); }
.hero-top b { color: var(--ink); font-weight: 600; display: flex; align-items: center; gap: 8px; }
.big { font: 700 34px/1.05 var(--f-display); letter-spacing: -.02em; margin: 12px 0 2px; font-variant-numeric: tabular-nums; }
.big .of { font: 500 15px/1.2 var(--f-body); letter-spacing: 0; color: var(--ink-2); margin-left: 4px; white-space: nowrap; }
.bar { position: relative; height: 12px; border-radius: 6px; background: var(--surface-2); margin: 14px 0 8px; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: var(--accent); min-width: 0; }
.bar .tick { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); border-radius: 1px; opacity: .55; }
.bar-foot { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--ink-2); flex-wrap: wrap; }
.tick-label { font-size: 12px; color: var(--ink-2); }

/* divisão do salário */
.alloc { display: flex; gap: 2px; height: 14px; margin: 8px 0 12px; position: relative; }
.alloc i { display: block; height: 100%; min-width: 0; border-radius: 3px; }
.alloc .mk { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); opacity: .6; border-radius: 1px; }
.legend { display: flex; flex-direction: column; gap: 6px; }
.legend div { display: flex; align-items: center; gap: 8px; font-size: 14px; min-width: 0; }
.legend .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.legend .lv { margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* etiquetas */
.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 3px 10px 3px 8px; font-size: 12.5px; font-weight: 600; line-height: 1.3; white-space: nowrap; }
.pill svg { width: 13px; height: 13px; flex: none; }
.pill.good, .pill.ok { background: var(--good-bg); color: var(--good-fg); }
.pill.warn { background: var(--warn-bg); color: var(--warn-fg); }
.pill.bad { background: var(--bad-bg); color: var(--bad-fg); }
.pill.info, .pill.neutral { background: var(--info-bg); color: var(--info-fg); }
.pill.neutral { background: var(--surface-2); color: var(--ink-2); }
.tag { font-size: 12px; font-weight: 600; color: var(--warn-fg); background: var(--warn-bg); border-radius: 6px; padding: 1px 6px; white-space: nowrap; }

/* avisos */
.alerts { display: flex; flex-direction: column; gap: 4px; }

.alert .ic { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; margin-top: 1px; }
.alert .ic svg { width: 13px; height: 13px; }
.alert.good .ic, .alert.ok .ic { background: var(--good-bg); color: var(--good-fg); }
.alert.warn .ic { background: var(--warn-bg); color: var(--warn-fg); }
.alert.bad .ic { background: var(--bad-bg); color: var(--bad-fg); }
.alert.info .ic { background: var(--info-bg); color: var(--info-fg); }
.link { color: var(--accent); font-weight: 600; font-size: 14px; padding: 8px 0 0; }

/* listas de despesas */
.list { display: flex; flex-direction: column; }
.item { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); min-width: 0; width: 100%; text-align: left; }
.item:first-child { border-top: 0; }
.item .body { flex: 1; min-width: 0; }
.item .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .m { font-size: 13px; color: var(--ink-2); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.item .amt { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.item .amt.in { color: var(--good-fg); }
.check { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; color: transparent; background: var(--surface); }
.check svg { width: 18px; height: 18px; }
.check.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.item.paid .t { color: var(--ink-2); }

/* categorias */
.cats { display: flex; flex-direction: column; gap: 10px; }
.cat .top { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; margin-bottom: 4px; }
.cat .top b { font-variant-numeric: tabular-nums; font-weight: 600; }
.cat .trk { height: 8px; border-radius: 4px; background: var(--surface-2); }
.cat .trk i { display: block; height: 100%; border-radius: 4px; background: var(--s1); }

/* controles */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 14px; font-weight: 600; background: var(--surface-2); color: var(--ink); border: 1px solid transparent; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; border-color: var(--line); }
.btn.danger { background: var(--bad-bg); color: var(--bad-fg); }
.btn.block { width: 100%; }
.btn.sm { min-height: 40px; padding: 0 14px; font-size: 14px; border-radius: 12px; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-row > * { flex: 1 1 140px; }
.seg { display: flex; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { flex: 1; min-height: 40px; border-radius: 10px; font-weight: 600; font-size: 14px; color: var(--ink-2); padding: 0 8px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(14, 26, 43, .15); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 38px; padding: 0 14px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); font-size: 14px; font-weight: 500; border: 1px solid transparent; }
.chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); font-weight: 600; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .lbl { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.inp { width: 100%; min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); padding: 0 14px; font-size: 16px; min-width: 0; }
.inp:focus { outline: 2px solid var(--accent); outline-offset: 0; background: var(--surface); }
.inp.money { font: 700 26px/1 var(--f-display); min-height: 58px; }
textarea.inp { padding: 12px 14px; min-height: 120px; font-size: 14px; font-family: ui-monospace, monospace; }
.hint { font-size: 12.5px; color: var(--muted); }
.err { color: var(--bad-fg); font-size: 13.5px; font-weight: 600; min-height: 0; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.sw-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
.switch { width: 50px; height: 30px; border-radius: 15px; background: var(--line); position: relative; flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .15s; }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(20px); }
details > summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--accent); min-height: 40px; display: flex; align-items: center; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details[open] > summary { margin-bottom: 8px; }
details > .stack { display: flex; flex-direction: column; gap: 14px; }

/* cartões de mês */
.mgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; margin-top: 12px; }
.mgrid div { min-width: 0; }
.mgrid dt { font-size: 12px; color: var(--ink-2); }
.mgrid dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
.mcard { width: 100%; text-align: left; display: block; }
.mcard.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.mcard .hd { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

/* gráficos */
.chart { width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--ink-2); font-family: var(--f-body); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { stroke: var(--line); stroke-width: 1.5; }
.chart-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--ink-2); margin-top: 8px; }
.chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
.chart-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.chart-read { margin-top: 10px; padding: 10px 12px; background: var(--surface-2); border-radius: 12px; font-size: 13.5px; }
.chart-read b { display: block; margin-bottom: 2px; }
.hit { fill: transparent; cursor: pointer; }

/* navegação */
#nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 6; }
#nav .in { display: grid; grid-template-columns: repeat(5, 1fr); }
#nav button { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 0 8px; font-size: 11.5px; font-weight: 600; color: var(--muted); min-height: 56px; }
#nav button svg { width: 24px; height: 24px; }
#nav button[aria-current="page"] { color: var(--accent); }
#fab { position: fixed; z-index: 7; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; border-radius: 18px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; box-shadow: 0 6px 16px rgba(14, 26, 43, .3); }
#fab svg { width: 28px; height: 28px; }

/* painel inferior */
#scrim { position: fixed; inset: 0; background: rgba(5, 12, 22, .5); z-index: 20; }
#sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 94%; overflow-y: auto; background: var(--surface); border-radius: 22px 22px 0 0; box-shadow: 0 -8px 30px rgba(0, 0, 0, .25); animation: up .2s ease-out; overscroll-behavior: contain; }
#sheet .sh { max-width: 560px; margin: 0 auto; padding-top: 10px; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; }
#sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 2px; }
#sheet .hd { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
#sheet .hd h3 { font: 700 20px/1.2 var(--f-display); margin: 0; }
#sheet .x { width: 40px; height: 40px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; color: var(--ink-2); }
@keyframes up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(150px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--ink); color: var(--bg); padding: 11px 16px; border-radius: 12px; font-size: 14px; font-weight: 500; max-width: min(92vw, 420px); text-align: center; pointer-events: none; opacity: 0; transition: opacity .2s; }
#toast.on { opacity: 1; }
.empty { text-align: center; padding: 18px 8px; color: var(--ink-2); font-size: 14px; }
.syncline { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); padding: 2px 4px; }
.syncline i { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
.syncline.cloud i { background: var(--good-fg); }
.syncline.local i, .syncline.error i { background: var(--warn-fg); }
.rec { display: flex; flex-direction: column; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); }
.rec:first-child { border-top: 0; }
.rec .rt { display: flex; justify-content: space-between; gap: 10px; align-items: center; }

@media (prefers-reduced-motion: reduce) {
  #sheet { animation: none; }
  .switch, .switch::after, #toast { transition: none; }
}
@media (max-width: 360px) {
  .big { font-size: 30px; }
  .big .of { display: block; margin: 4px 0 0; }
}

.stats3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stats3 div { min-width: 0; }
.stats3 span { display: block; font-size: 12px; color: var(--ink-2); }
.stats3 b { font: 700 17px/1.2 var(--f-display); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.itembtn { flex: 1; display: flex; align-items: center; gap: 12px; min-width: 0; text-align: left; }
.itembtn .body { flex: 1; min-width: 0; }
.item .body { flex: 1; min-width: 0; }
.item .body .t, .item .body .m { display: block; }
.item .body .m { display: flex; }
.tag.info { color: var(--info-fg); background: var(--info-bg); }
.mgrid { margin-bottom: 0; margin-left: 0; margin-right: 0; }
.syncline.rt-live i { background: var(--good-fg); }
.syncline.rt-saving i, .syncline.rt-connecting i, .syncline.rt-offline i { background: var(--warn-fg); }
.syncline.rt-denied i { background: var(--bad-fg); }

</style>

<script>
/* Rumo ao Chile - regras de cálculo (sem nada de tela, para poder ser testado) */
(function (root) {
  'use strict';

  var MN = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho',

  var MS = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];

  /* ---------- utilitários ---------- */
  function r2(n) { return Math.round((Number(n) + Number.EPSILON) * 100) / 100; }
  function sum(a, f) { var s = 0; for (var i = 0; i < a.length; i++) s += f ? f(a[i]) : a[i]; return s; }
  function pad(n) { return String(n).padStart(2, '0'); }
  function todayStr(d) {

  function parseBR(s) {

  function defaultState() {

        weeks: 4.33,
        monthlyGoal: 500,
        startMonth: '2026-11',
        ticketsGoal: 1500,
        spendGoal: 2000,
        ticketsDeadline: '2027-05-31',
        finalDeadline: '2027-06-30'
      },
      recurring: [
        { id: 'r_transp', name: 'Transporte para o trabalho', cat: 'Transporte', kind: 'transport', amount: 0, active: true, confirmed: true },
        { id: 'r_food', name: 'Alimentação', cat: 'Alimentação', kind: 'fixed', amount: 100, active: true, confirmed: true },
        { id: 'r_net', name: 'Internet', cat: 'Internet', kind: 'fixed', amount: 100, active: false, confirmed: false }
      ],
      cats: DEFAULT_CATS.slice(),
      expenses: [],
      incomes: [],
      savings: [],
      plan: {}
    };
  }

  function migrate(s) {
    var d = defaultState();
    if (!s || typeof s !== 'object') return d;
    var out = {
      v: 1,
      updated: Number(s.updated) || 0,
      settings: Object.assign({}, d.settings, s.settings || {}),
      recurring: Array.isArray(s.recurring) ? s.recurring : d.recurring,
      cats: Array.isArray(s.cats) && s.cats.length ? s.cats : d.cats,
      expenses: Array.isArray(s.expenses) ? s.expenses : [],
      incomes: Array.isArray(s.incomes) ? s.incomes : [],
      savings: Array.isArray(s.savings) ? s.savings : [],
      plan: s.plan && typeof s.plan === 'object' ? s.plan : {}
    };
    if (out.cats.indexOf(FUND_CAT) < 0) out.cats.push(FUND_CAT);
    return out;
  }

  /* ---------- despesas do mês ---------- */
  function transportDaily(st) { return r2(Number(st.fare) + Number(st.uber)); }
  function transportMonthly(st) { return r2((Number(st.fare) + Number(st.uber)) * Number(st.days) * Number(st.weeks)); }
  function recAmount(S, r) { return r.kind === 'transport' ? transportMonthly(S.settings) : r2(r.amount); }

  /* Itens do mês = despesas registradas + despesas que se repetem e ainda não foram registradas
     naquele mês. Se uma recorrente já foi registrada (recId), ela substitui a prevista: nunca conta 2x. */
  function monthItems(S, M) {
    var items = [];
    var regs = S.expenses.filter(function (e) { return mk(e.date) === M; });
    var used = {};
    regs.forEach(function (e) { if (e.recId) used[e.recId] = true; });
    if (M >= S.settings.startMonth) {
      S.recurring.forEach(function (r) {
        if (!r.active || used[r.id]) return;
        items.push({
          virtual: true, id: 'v_' + r.id + '_' + M, recId: r.id, name: r.name, cat: r.cat,
          amount: recAmount(S, r), type: 'fixa', status: 'pendente', confirmed: r.confirmed !== false,
          date: M + '-01', note: ''
        });
      });
    }
    regs.forEach(function (e) {
      items.push({
        virtual: false, id: e.id, recId: e.recId, name: e.name, cat: e.cat, amount: r2(e.amount),
        type: e.type, status: e.status, confirmed: e.confirmed !== false, date: e.date, note: e.note || ''
      });
    });
    return items;
  }

  function planFor(S, M) {
    var p = S.plan[M] || {};
    var started = M >= S.settings.startMonth;
    var hasS = p.salary != null && p.salary !== '', hasG = p.goal != null && p.goal !== '';
    return {
      salary: hasS ? Number(p.salary) : (started ? Number(S.settings.salary) : 0),
      goal: hasG ? Number(p.goal) : (started ? Number(S.settings.monthlyGoal) : 0),
      customSalary: hasS, customGoal: hasG
    };
  }

  function monthStats(S, M, today) {
    var cur = mk(today || todayStr());
    var items = monthItems(S, M);
    // Despesas "Viagem para o Chile" saem do dinheiro guardado da viagem, não do salário.
    var budget = items.filter(function (i) { return i.cat !== FUND_CAT; });
    var fund = items.filter(function (i) { return i.cat === FUND_CAT; });
    var planned = r2(sum(budget, function (i) { return i.amount; }));
    var paid = r2(sum(budget.filter(function (i) { return i.status === 'paga'; }), function (i) { return i.amount; }));
    var estimates = r2(sum(budget.filter(function (i) { return !i.confirmed; }), function (i) { return i.amount; }));
    var fundPaid = r2(sum(fund.filter(function (i) { return i.status === 'paga'; }), function (i) { return i.amount; }));
    var received = r2(sum(S.incomes.filter(function (x) { return mk(x.date) === M; }), function (x) { return x.amount; }));
    var sv = S.savings.filter(function (x) { return mk(x.date) === M; });
    var savedTrip = r2(sum(sv.filter(function (x) { return x.dest !== 'reserva'; }), function (x) { return x.amount; }));
    var savedReserve = r2(sum(sv.filter(function (x) { return x.dest === 'reserva'; }), function (x) { return x.amount; }));
    var savedAll = r2(savedTrip + savedReserve);
    var pl = planFor(S, M);
    var available = r2(received - paid - savedAll);
    var incomeRef = Math.max(received, pl.salary);
    var margin = r2(incomeRef - planned);
    var free = r2(margin - Math.max(pl.goal, savedAll));
    return {
      M: M, rel: M > cur ? 'future' : (M === cur ? 'current' : 'past'),
      items: items, planned: planned, paid: paid, pending: r2(planned - paid), estimates: estimates,
      fundPaid: fundPaid, received: received, plannedSalary: pl.salary, goal: pl.goal,
      savedTrip: savedTrip, savedReserve: savedReserve, savedAll: savedAll,
      available: available, incomeRef: incomeRef, margin: margin, free: free,
      feasible: pl.goal <= 0 || margin >= pl.goal
    };
  }

  function catTotals(S, M) {
    var map = {};
    monthItems(S, M).forEach(function (i) {
      var c = map[i.cat] || (map[i.cat] = { cat: i.cat, total: 0, paid: 0 });
      c.total = r2(c.total + i.amount);
      if (i.status === 'paga') c.paid = r2(c.paid + i.amount);
    });
    return Object.keys(map).map(function (k) { return map[k]; })
      .filter(function (c) { return c.total > 0; })
      .sort(function (a, b) { return b.total - a.total; });
  }

  /* ---------- viagem ---------- */
  function refMonth(S, today) { return maxMonth(mk(today || todayStr()), S.settings.startMonth); }

  function tripStats(S, today) {
    today = today || todayStr();
    var st = S.settings;
    var goal = r2(Number(st.ticketsGoal) + Number(st.spendGoal));
    var trip = S.savings.filter(function (x) { return x.dest !== 'reserva'; });
    var saved = r2(sum(trip, function (x) { return x.amount; }));
    var spent = r2(sum(S.expenses.filter(function (e) { return e.cat === FUND_CAT && e.status === 'paga'; }), function (e) { return e.amount; }));
    var R = refMonth(S, today);
    var remaining = r2(Math.max(0, goal - saved));
    var ticketsRem = r2(Math.max(0, Number(st.ticketsGoal) - saved));
    var mTickets = Math.max(0, monthDiff(R, mk(st.ticketsDeadline)) + 1);
    var mFinal = Math.max(0, monthDiff(R, mk(st.finalDeadline)) + 1);
    var needTickets = ticketsRem <= 0 ? 0 : (mTickets > 0 ? ticketsRem / mTickets : Infinity);
    var needFinal = remaining <= 0 ? 0 : (mFinal > 0 ? remaining / mFinal : Infinity);
    var needMonth = Math.max(needTickets, needFinal);
    var weeks = Number(st.weeks) || 4.33;
    var from = today > R + '-01' ? today : R + '-01';
    return {
      goal: goal, saved: saved, spent: spent, inFund: r2(saved - spent), remaining: remaining,
      pct: goal > 0 ? Math.min(100, (saved / goal) * 100) : 0,
      ticketsMark: goal > 0 ? (Number(st.ticketsGoal) / goal) * 100 : 0,
      ticketsRem: ticketsRem, ticketsDone: ticketsRem <= 0,
      refMonth: R, monthsToTickets: mTickets, monthsToFinal: mFinal,
      needTickets: isFinite(needTickets) ? r2(needTickets) : null,
      needFinal: isFinite(needFinal) ? r2(needFinal) : null,
      needMonth: isFinite(needMonth) ? r2(needMonth) : null,
      needWeek: isFinite(needMonth) ? r2(needMonth / weeks) : null,
      daysToTickets: daysBetween(from, st.ticketsDeadline),
      daysToFinal: daysBetween(from, st.finalDeadline),
      ticketsOverdue: ticketsRem > 0 && mTickets === 0,
      finalOverdue: remaining > 0 && mFinal === 0,
      done: goal > 0 && saved >= goal
    };
  }

  function savedTripIn(S, M) {
    return r2(sum(S.savings.filter(function (x) { return x.dest !== 'reserva' && mk(x.date) === M; }), function (x) { return x.amount; }));
  }

  /* Ritmo real = média guardada por mês completo (do início do plano até o mês anterior ao atual). */
  function paceReal(S, today) {
    var cur = mk(today || todayStr());
    var n = monthDiff(S.settings.startMonth, cur);
    if (n < 1) return null;
    var tot = sum(S.savings.filter(function (x) { return x.dest !== 'reserva' && mk(x.date) < cur; }), function (x) { return x.amount; });
    return r2(tot / n);
  }

  /* Simula mês a mês quando a meta fecha. rateFn(M) = quanto se guarda em cada mês. */
  function simulate(S, today, rateFn) {
    var t = tripStats(S, today);
    if (t.done) return { done: true, month: null };
    var cum = t.saved, R = t.refMonth;
    for (var i = 0; i < 120; i++) {
      var M = addMonths(R, i);
      var add = rateFn(M);
      if (i === 0) add = Math.max(0, add - savedTripIn(S, M));
      cum += add;
      if (cum >= t.goal - 0.005) return { done: false, month: M };
    }
    return { done: false, month: null };
  }

  function projection(S, today) {
    var pace = paceReal(S, today);
    if (pace != null) {
      var a = simulate(S, today, function () { return pace; });
      return { basis: 'real', rate: pace, done: a.done, month: a.month };
    }
    var p = simulate(S, today, function (M) { return planFor(S, M).goal; });
    return { basis: 'plan', rate: Number(S.settings.monthlyGoal), done: p.done, month: p.month };
  }

  /* ---------- planejamento ---------- */
  function monthList(S) {
    var all = [S.settings.startMonth, mk(S.settings.finalDeadline), mk(S.settings.ticketsDeadline)];
    S.expenses.concat(S.incomes, S.savings).forEach(function (x) { if (x.date) all.push(mk(x.date)); });
    all.sort();
    return monthRange(all[0], all[all.length - 1]);
  }
  function planMonths(S) { return monthRange(S.settings.startMonth, mk(S.settings.finalDeadline)); }

  function chartSeries(S, today) {
    var cur = mk(today || todayStr());
    var months = planMonths(S);
    var cumPlan = 0, cumAct = 0, rows = [];
    // economias anteriores ao início do plano contam como já guardadas
    cumAct = sum(S.savings.filter(function (x) { return x.dest !== 'reserva' && mk(x.date) < months[0]; }), function (x) { return x.amount; });
    months.forEach(function (M) {
      var st = monthStats(S, M, today);
      cumPlan = r2(cumPlan + st.goal);
      cumAct = r2(cumAct + st.savedTrip);
      rows.push({ M: M, planned: st.planned, goal: st.goal, saved: st.savedTrip, paid: st.paid,
        cumPlan: cumPlan, cumAct: M <= cur ? cumAct : null, cumFc: null });
    });
    // previsão: parte do real acumulado até o mês atual e segue com as metas planejadas
    var base = 0, lastIdx = -1;
    rows.forEach(function (r, i) { if (r.cumAct != null) lastIdx = i; });
    if (lastIdx >= 0) {
      base = rows[lastIdx].cumAct;
      rows[lastIdx].cumFc = base;
      for (var i = lastIdx + 1; i < rows.length; i++) { base = r2(base + rows[i].goal); rows[i].cumFc = base; }
    }
    return rows;
  }

  /* ---------- avisos (só com os números registrados) ---------- */
  function alerts(S, M, today) {
    today = today || todayStr();
    var out = [];
    var st = monthStats(S, M, today), tr = tripStats(S, today), pj = projection(S, today);
    var name = monthName(M), only = monthOnly(M);
    var started = M >= S.settings.startMonth;

    if (tr.done) out.push({ kind: 'good', text: 'Meta do Chile atingida: você já guardou ' + brl(tr.saved) + ' dos ' + brl(tr.goal) + '.' });
    else if (tr.saved > 0) out.push({ kind: 'good', text: 'Você já guardou ' + Math.floor(tr.pct) + '% da sua meta para o Chile (' + brl(tr.saved) + ' de ' + brl(tr.goal) + ').' });
    else out.push({ kind: 'info', text: 'Você ainda não guardou nada para o Chile. Para chegar na meta, o ritmo é de ' + (tr.needMonth != null ? brl(tr.needMonth) : '—') + ' por mês.' });

    if (started && st.goal > 0) {
      if (!st.feasible) out.push({ kind: 'bad', text: 'Sua meta de guardar ' + brl(st.goal) + ' em ' + only + ' é maior do que o dinheiro disponível: depois das despesas sobram ' + brl(Math.max(0, st.margin)) + '.' });
      else out.push({ kind: 'ok', text: 'Guardar ' + brl(st.goal) + ' em ' + only + ' é possível: depois das despesas previstas sobram ' + brl(st.margin) + ', e ' + brl(Math.max(0, st.free)) + ' ficam livres.' });
    }

    if (!tr.done) {
      if (pj.month) {
        var late = pj.month > mk(S.settings.finalDeadline);
        var basis = pj.basis === 'real' ? 'no seu ritmo real de ' + brl(pj.rate) + ' por mês' : 'guardando a meta de ' + brl(pj.rate) + ' por mês';
        out.push({ kind: late ? 'warn' : 'ok', text: (late ? 'Atenção: ' : 'Se continuar economizando assim, ') + basis + ', a meta será atingida em ' + monthName(pj.month) + (late ? ', depois do prazo final.' : '.') });
      } else if (pj.basis === 'real') {
        out.push({ kind: 'warn', text: 'No seu ritmo real de ' + brl(pj.rate) + ' por mês, a meta do Chile não fecha. Registre o que guardar ou ajuste a meta.' });
      }
    }

    if (tr.ticketsRem > 0) {
      if (tr.ticketsOverdue) out.push({ kind: 'bad', text: 'O prazo das passagens (' + fmtDate(S.settings.ticketsDeadline) + ') já passou e ainda faltam ' + brl(tr.ticketsRem) + '.' });
      else out.push({ kind: 'info', text: 'Você ainda precisa juntar ' + brl(tr.ticketsRem) + ' para comprar as passagens até ' + monthName(mk(S.settings.ticketsDeadline)) + '.' });
    }

    var planGoal = Number(S.settings.monthlyGoal);
    if (!tr.done && tr.needMonth != null && tr.needMonth > planGoal + 0.005) {
      out.push({ kind: 'warn', text: 'Para fechar a meta no prazo é preciso guardar ' + brl(tr.needMonth) + ' por mês, mais que os ' + brl(planGoal) + ' planejados.' });
    }

    var prev = addMonths(M, -1);
    var curT = (catTotals(S, M).filter(function (c) { return c.cat === 'Transporte'; })[0] || { total: 0 }).total;
    var prevT = (catTotals(S, prev).filter(function (c) { return c.cat === 'Transporte'; })[0] || { total: 0 }).total;
    if (prevT > 0 && curT > prevT + 0.005) out.push({ kind: 'warn', text: 'Você gastou mais com transporte em ' + only + ': ' + brl(curT) + ', ' + brl(curT - prevT) + ' a mais que em ' + monthOnly(prev) + '.' });

    if (st.estimates > 0) {
      var names = st.items.filter(function (i) { return !i.confirmed && i.cat !== FUND_CAT; }).map(function (i) { return i.name; });
      out.push({ kind: 'info', text: brl(st.estimates) + ' das despesas de ' + only + ' ainda são estimativas (' + names.join(', ') + ').' });
    }
    if (st.available < -0.005) out.push({ kind: 'warn', text: 'O saldo disponível de ' + only + ' está negativo (' + brl(st.available) + '): você pagou ou guardou mais do que registrou como recebido.' });
    if (started && st.rel !== 'future' && st.received === 0) out.push({ kind: 'info', text: 'Você ainda não registrou o salário de ' + name + '.' });

    var order = { bad: 0, warn: 1, info: 2, ok: 3, good: 3 };
    return out.map(function (a, i) { a.i = i; return a; })
      .sort(function (a, b) { return order[a.kind] - order[b.kind] || a.i - b.i; });
  }

  /* ---------- operações (cadastrar / editar / excluir) ---------- */
  function upsert(list, obj) {
    if (!obj.id) obj.id = uid();
    for (var i = 0; i < list.length; i++) if (list[i].id === obj.id) { list[i] = obj; return obj; }
    list.push(obj);
    return obj;
  }
  function removeById(list, id) {
    for (var i = 0; i < list.length; i++) if (list[i].id === id) { list.splice(i, 1); return true; }
    return false;
  }
  function togglePaid(S, item, dateIfNew) {
    if (item.virtual) {
      return upsert(S.expenses, {
        id: uid(), name: item.name, amount: item.amount, cat: item.cat, date: dateIfNew,
        type: 'fixa', status: 'paga', confirmed: item.confirmed, note: '', recId: item.recId
      });
    }
    var e = S.expenses.filter(function (x) { return x.id === item.id; })[0];
    if (e) e.status = e.status === 'paga' ? 'pendente' : 'paga';
    return e;
  }

  var api = {
    FUND_CAT: FUND_CAT, DEFAULT_CATS: DEFAULT_CATS, MN: MN, MS: MS,
    r2: r2, sum: sum, todayStr: todayStr, mk: mk, addMonths: addMonths, monthDiff: monthDiff, monthRange: monthRange,
    daysBetween: daysBetween, uid: uid, brl: brl, brlShort: brlShort, monthName: monthName, monthLbl: monthLbl,
    monthOnly: monthOnly, fmtDate: fmtDate, parseBR: parseBR, toInput: toInput,
    defaultState: defaultState, migrate: migrate,
    transportDaily: transportDaily, transportMonthly: transportMonthly, recAmount: recAmount,
    monthItems: monthItems, planFor: planFor, monthStats: monthStats, catTotals: catTotals,
    refMonth: refMonth, tripStats: tripStats, paceReal: paceReal, projection: projection, simulate: simulate,
    monthList: monthList, planMonths: planMonths, chartSeries: chartSeries, alerts: alerts,
    upsert: upsert, removeById: removeById, togglePaid: togglePaid
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  root.RC = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Rumo ao Chile - telas, eventos e armazenamento */
(function () {
  'use strict';
  var R = window.RC;
  var KEY = 'rumo-ao-chile:v1';
  var brl = R.brl;
  function $(s) { return document.querySelector(s); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function today() { return R.todayStr(); }

  /* ================= armazenamento ================= */
  var state;
  try { var raw = localStorage.getItem(KEY); state = raw ? R.migrate(JSON.parse(raw)) : R.defaultState(); }
  catch (e) { state = R.defaultState(); }

  var sync = 'checking', ref = null, pushing = false, pushAgain = false, ptimer = null;
  function syncText() {
    return {
      checking: 'Conectando à sua conta…',
      cloud: 'Dados salvos na sua conta (e uma cópia neste aparelho)',
      saving: 'Salvando…',
      local: 'Dados salvos só neste aparelho',
      error: 'Sem conexão com a conta agora. Seus dados estão salvos neste aparelho.',
      'rt-connecting': 'Conectando à sincronização…',
      'rt-saving': 'Sincronizando…',
      'rt-live': 'Sincronizado com os outros aparelhos',
      'rt-offline': 'Sem conexão. Salvo neste aparelho e sincroniza quando a internet voltar.',
      'rt-denied': 'O banco de dados recusou o acesso. Confira as regras no Firebase.'
    }[sync];
  }
  function setSync(s) {
    sync = s;
    document.querySelectorAll('.js-sync').forEach(function (el) {
      el.className = 'syncline js-sync ' + sync;
      el.querySelector('span').textContent = syncText();
    });
  }
  function save() {
    state.updated = Date.now();
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* sem armazenamento local */ }
    schedulePush();
    if (rt) { setSync('rt-saving'); rtSchedule(400); }
  }
  function schedulePush() {
    if (!ref) return;
    setSync('saving');
    clearTimeout(ptimer);
    ptimer = setTimeout(doPush, 700);
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function doPush() {
    if (!ref) return Promise.resolve();
    if (pushing) { pushAgain = true; return Promise.resolve(); }
    pushing = true;
    var body = { json: JSON.stringify(state), updated: state.updated };
    return ref.set(body).catch(function (e) {
      if (e && e.code === 'unavailable') return sleep(900 + Math.random() * 600).then(function () { return ref.set(body); });
      throw e;
    }).then(function () { setSync('cloud'); }, function () { setSync('error'); }).then(function () {
      pushing = false;
      if (pushAgain) { pushAgain = false; return doPush(); }
    });
  }
  function initCloud() {
    if (!window.claude || typeof window.claude.use !== 'function') { setSync('local'); return; }
    Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function (r) {
      var db = r[0], user = r[1];
      if (!db || !user) { setSync('local'); return null; }
      return user.id().then(function (uid) {
        if (!uid) { setSync('local'); return null; }
        ref = db.doc('data/users/' + uid + '/finance');
        return ref.get().then(function (snap) {
          var remote = null;
          if (snap.exists) {
            var d = snap.data() || {};
            try { remote = R.migrate(JSON.parse(d.json)); remote.updated = Number(d.updated) || remote.updated; } catch (e) { remote = null; }
          }
          if (remote && remote.updated > state.updated) {
            state = remote;
            try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ok */ }
            fixMonth(); renderAll(); setSync('cloud');
          } else if (state.updated > 0 && (!remote || state.updated > remote.updated)) {
            setSync('saving'); return doPush();
          } else setSync('cloud');
        });
      });
    }).catch(function () { ref = null; setSync('local'); });
  }

  /* ================= estado da tela ================= */
  var ui = { tab: 'home', month: null, filter: 'todas', sheet: null, alertsAll: false, chartSel: null };
  function initialMonth() {
    var list = R.monthList(state), cur = R.mk(today());
    var m = cur < state.settings.startMonth ? state.settings.startMonth : cur;
    if (list.indexOf(m) < 0) m = m > list[list.length - 1] ? list[list.length - 1] : list[0];
    return m;
  }
  function fixMonth() { if (R.monthList(state).indexOf(ui.month) < 0) ui.month = initialMonth(); }
  ui.month = initialMonth();

  /* ================= ícones ================= */
  var IC = {
    home: '<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
    list: '<path d="M4 6h16M4 12h16M4 18h10"/>',
    peak: '<path d="M3 19l6-11 4 7 3-4 5 8z"/>',
    chart: '<path d="M5 20v-9M12 20V4M19 20v-6"/>',
    sliders: '<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    left: '<path d="M15 6l-6 6 6 6"/>', right: '<path d="M9 6l6 6-6 6"/>',
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>', x: '<path d="M6 6l12 12M18 6L6 18"/>',
    alert: '<path d="M12 7v6M12 17v.5"/>', info: '<path d="M12 11v6M12 7v.5"/>'
  };
  function svg(n, s) { s = s || 24; return '<svg viewBox="0 0 24 24" width="' + s + '" height="' + s + '" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + IC[n] + '</svg>'; }
  function flag(w) {

  }
  function alertIcon(kind) { return kind === 'good' || kind === 'ok' ? 'check' : (kind === 'info' ? 'info' : 'alert'); }

  /* ================= cabeçalho e navegação ================= */
  var TABS = [['home', 'Início', 'home'], ['desp', 'Despesas', 'list'], ['chile', 'Chile', 'peak'], ['plan', 'Plano', 'chart'], ['more', 'Mais', 'sliders']];
  function renderTop() {

    var showM = ui.tab === 'home' || ui.tab === 'desp' || ui.tab === 'plan';

      (showM ? '<div class="stepper"><button data-act="prevM" aria-label="Mês anterior"' + (i <= 0 ? ' disabled' : '') + '>' + svg('left', 20) + '</button>' +
        '<button class="mlabel" data-act="pickM" aria-label="Escolher mês">' + R.monthLbl(ui.month) + '</button>' +
        '<button data-act="nextM" aria-label="Próximo mês"' + (i >= list.length - 1 ? ' disabled' : '') + '>' + svg('right', 20) + '</button></div>' : '') + '</div>';
  }
  function renderNav() {
    $('#nav').innerHTML = '<div class="wrap gut in">' + TABS.map(function (t) {

    }).join('') + '</div>';
  }
  function renderAll() { renderTop(); renderView(); renderNav(); if (ui.sheet) renderSheet(); }
  function renderView() {

  }
  function toast(msg) {
    var t = $('#toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(toast.t); toast.t = setTimeout(function () { t.classList.remove('on'); }, 2600);
  }

  /* ================= peças reutilizáveis ================= */
  function pill(kind, text) { return '<span class="pill ' + kind + '">' + (kind === 'neutral' ? '' : svg(alertIcon(kind), 13)) + esc(text) + '</span>'; }
  function syncLine() { return '<div class="syncline js-sync ' + sync + '"><i></i><span>' + esc(syncText()) + '</span></div>'; }
  function neg(n) { return n < -0.004 ? ' neg' : ''; }
  function defaultDateIn(M) { return R.mk(today()) === M ? today() : M + '-01'; }

  /* ================= INÍCIO ================= */
  function heroCard(tr) {
    var s = state.settings;
    return '<button class="card lift hero" data-act="goChile" aria-label="Abrir Minha viagem para o Chile">' +
      '<div class="hero-top"><b>' + flag(24) + 'Minha viagem para o Chile</b><span>' + esc(R.monthName(R.mk(s.finalDeadline))) + '</span></div>' +
      '<div class="big">' + brl(tr.saved) + '<span class="of">de ' + brl(tr.goal) + '</span></div>' +
      '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + Math.round(tr.pct) + '"><i style="width:' + tr.pct.toFixed(1) + '%"></i><b class="tick" style="left:calc(' + tr.ticketsMark.toFixed(1) + '% - 1px)"></b></div>' +
      '<div class="bar-foot"><span>' + Math.floor(tr.pct) + '% da meta</span><span>' + (tr.done ? 'meta atingida' : 'faltam ' + brl(tr.remaining)) + '</span></div></button>';
  }

  function viewHome() {
    var M = ui.month, td = today(), st = R.monthStats(state, M, td), tr = R.tripStats(state, td), only = R.monthOnly(M);
    var h = heroCard(tr);

    h += '<section class="card"><h2>Caixa de ' + only + '</h2>' +
      '<div class="row"><div class="l">Salário recebido' + (st.plannedSalary > 0 ? '<small>previsto ' + brl(st.plannedSalary) + '</small>' : '') + '</div><div class="v">' + brl(st.received) + '</div></div>' +
      '<div class="row"><div class="l">Despesas pagas<small>de ' + brl(st.planned) + ' previstas no mês</small></div><div class="v">' + brl(st.paid) + '</div></div>' +
      '<div class="row"><div class="l">Economizado no mês<small>' + brl(st.savedTrip) + ' para a viagem' + (st.savedReserve > 0 ? ' · ' + brl(st.savedReserve) + ' na reserva' : '') + '</small></div><div class="v">' + brl(st.savedAll) + '</div></div>' +
      '<div class="row total"><div class="l">Saldo disponível<small>recebido − pago − guardado</small></div><div class="v' + neg(st.available) + '">' + brl(st.available) + '</div></div>' +
      '<div class="btn-row" style="margin-top:12px"><button class="btn sm" data-act="newIncome">' + svg('plus', 18) + 'Recebi</button><button class="btn sm" data-act="newSaving">' + svg('plus', 18) + 'Guardei</button></div></section>';

    if (st.incomeRef > 0 || st.planned > 0) {
      var goalUse = Math.max(st.goal, st.savedAll);
      var scale = Math.max(st.incomeRef, st.planned + goalUse) || 1;
      var free = Math.max(0, st.free);
      h += '<section class="card"><h2>Seu salário em ' + only + '</h2>' +
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span class="sub">Base: ' + brl(st.incomeRef) + '</span>' +
        (st.goal > 0 ? (st.feasible ? pill('good', 'Meta de guardar é possível') : pill('bad', 'Meta maior que o disponível')) : '') + '</div>' +
        '<div class="alloc" role="img" aria-label="Divisão do salário entre despesas, meta de guardar e valor livre">' +
        (st.planned > 0 ? '<i style="flex:' + st.planned + ' 1 0;background:var(--s2)"></i>' : '') +
        (goalUse > 0 ? '<i style="flex:' + goalUse + ' 1 0;background:var(--s3)"></i>' : '') +

        (st.planned + goalUse > st.incomeRef + 0.005 ? '<b class="mk" style="left:' + (st.incomeRef / scale * 100).toFixed(1) + '%"></b>' : '') + '</div>' +
        '<div class="legend">' +
        '<div><span class="sw" style="background:var(--s2)"></span>Despesas do mês<span class="lv">' + brl(st.planned) + '</span></div>' +
        '<div><span class="sw" style="background:var(--s3)"></span>Meta de guardar<span class="lv">' + brl(goalUse) + '</span></div>' +
        '<div><span class="sw" style="background:var(--s1)"></span>' + (st.free < 0 ? 'Falta para a meta' : 'Livre para gastar') + '<span class="lv' + neg(st.free) + '">' + brl(Math.abs(st.free)) + '</span></div></div>' +
        '<p class="hint" style="margin:10px 0 0">' + (st.free >= 0 ? 'Você pode gastar até ' + brl(st.free) + ' além das despesas previstas sem comprometer a meta.' : 'As despesas previstas e a meta passam do salário em ' + brl(-st.free) + '.') +

      return '<div class="alert ' + a.kind + '"><span class="ic">' + svg(alertIcon(a.kind), 13) + '</span><span>' + esc(a.text) + '</span></div>';
    }).join('') + '</div>' + (al.length > 4 ? '<button class="link" data-act="alertsAll">' + (ui.alertsAll ? 'Mostrar menos' : 'Ver todos (' + al.length + ')') + '</button>' : '') + '</section>';

    var mv = state.incomes.filter(function (x) { return R.mk(x.date) === M; }).map(function (x) { return { k: 'in', id: x.id, date: x.date, amount: x.amount, title: x.desc || 'Recebimento' }; })
      .concat(state.savings.filter(function (x) { return R.mk(x.date) === M; }).map(function (x) { return { k: 'sv', id: x.id, date: x.date, amount: x.amount, title: x.dest === 'reserva' ? 'Guardado na reserva' : 'Guardado para a viagem' }; }))
      .sort(function (a, b) { return b.date < a.date ? -1 : b.date > a.date ? 1 : 0; });
    h += '<section class="card"><h2>Recebimentos e economias</h2>' + (mv.length ? '<div class="list">' + mv.map(function (x) {
      return '<button class="item" data-act="editMv" data-k="' + x.k + '" data-id="' + esc(x.id) + '"><span class="body"><div class="t">' + esc(x.title) + '</div><div class="m">' + R.fmtDate(x.date) + '</div></span><span class="amt' + (x.k === 'in' ? ' in' : '') + '">' + (x.k === 'in' ? '+ ' : '→ ') + brl(x.amount) + '</span></button>';
    }).join('') + '</div>' : '<div class="empty">Nada registrado em ' + esc(R.monthName(M)) + '. Use “Recebi” quando o salário cair e “Guardei” quando separar dinheiro.</div>') + '</section>';

  /* ================= DESPESAS ================= */
  function itemRow(i) {
    var paid = i.status === 'paga';
    return '<div class="item' + (paid ? ' paid' : '') + '"><button class="check' + (paid ? ' on' : '') + '" data-act="togglePay" data-id="' + esc(i.id) + '" aria-label="' + (paid ? 'Marcar como pendente' : 'Marcar como paga') + '" aria-pressed="' + paid + '">' + svg('check', 18) + '</button>' +
      '<button class="itembtn" data-act="editItem" data-id="' + esc(i.id) + '"><span class="body"><div class="t">' + esc(i.name) + '</div><div class="m"><span>' + esc(i.cat) + '</span><span>· ' + (i.type === 'fixa' ? 'Fixa' : 'Variável') + '</span><span>· ' + (i.virtual ? 'prevista' : R.fmtDate(i.date)) + '</span>' +
      (i.confirmed ? '' : '<span class="tag">Estimativa</span>') + (i.cat === R.FUND_CAT ? '<span class="tag info">Sai do fundo da viagem</span>' : '') + '</div></span>' +
      '<span class="amt">' + brl(i.amount) + '</span></button></div>';
  }
  function viewDesp() {
    var M = ui.month, st = R.monthStats(state, M, today()), items = st.items;
    var shown = items.filter(function (i) { return ui.filter === 'todas' || (ui.filter === 'pendente' ? i.status !== 'paga' : i.status === 'paga'); })
      .sort(function (a, b) {
        var pa = a.status === 'paga' ? 1 : 0, pb = b.status === 'paga' ? 1 : 0;
        if (pa !== pb) return pa - pb;
        if (a.virtual !== b.virtual) return a.virtual ? -1 : 1;
        return pa ? (a.date < b.date ? 1 : -1) : (a.date > b.date ? 1 : -1);
      });
    var h = '<section class="card"><h2>Despesas de ' + R.monthOnly(M) + '</h2><div class="stats3">' +
      '<div><span>Previstas</span><b>' + brl(st.planned) + '</b></div><div><span>Pagas</span><b>' + brl(st.paid) + '</b></div><div><span>A pagar</span><b>' + brl(st.pending) + '</b></div></div>' +

    }).join('') + '</div></section>';

    h += '<div class="seg" role="group" aria-label="Filtrar despesas">' + [['todas', 'Todas'], ['pendente', 'A pagar'], ['paga', 'Pagas']].map(function (f) {
      return '<button data-act="filter" data-v="' + f[0] + '" aria-pressed="' + (ui.filter === f[0]) + '">' + f[1] + '</button>';
    }).join('') + '</div>';

    h += '<section class="card">' + (shown.length ? '<div class="list">' + shown.map(itemRow).join('') + '</div>' :
      '<div class="empty">' + (items.length ? 'Nenhuma despesa neste filtro.' : 'Nenhuma despesa em ' + esc(R.monthName(M)) + '.') + '</div>') + '</section>' +
      '<button class="btn primary block" data-act="newExpense">' + svg('plus', 20) + 'Nova despesa</button>';
    return h;
  }

  /* ================= VIAGEM ================= */
  function viewChile() {
    var td = today(), tr = R.tripStats(state, td), pj = R.projection(state, td), s = state.settings;
    var h = '<section class="card lift"><div class="hero-top"><b>' + flag(26) + 'Minha viagem para o Chile</b></div>' +
      '<p class="sub" style="margin:4px 0 0">Cerca de uma semana · ' + esc(R.monthName(R.mk(s.finalDeadline))) + '</p>' +
      '<div class="big">' + brl(tr.saved) + '<span class="of">de ' + brl(tr.goal) + '</span></div>' +
      '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + Math.round(tr.pct) + '"><i style="width:' + tr.pct.toFixed(1) + '%"></i><b class="tick" style="left:calc(' + tr.ticketsMark.toFixed(1) + '% - 1px)"></b></div>' +
      '<div class="bar-foot"><span><b>' + Math.floor(tr.pct) + '%</b> concluído</span><span>' + (tr.done ? 'meta atingida' : 'faltam ' + brl(tr.remaining)) + '</span></div>' +
      '<p class="tick-label" style="margin:8px 0 0">Traço na barra: valor das passagens (' + brl(s.ticketsGoal) + ')</p></section>';

    var needTxt = tr.needMonth == null ? '—' : brl(tr.needMonth);
    var mStatus = '';
    if (!tr.done && tr.needMonth != null) mStatus = tr.needMonth > Number(s.monthlyGoal) + 0.005 ? pill('warn', 'Sua meta mensal está abaixo do necessário') : pill('good', 'Sua meta mensal cobre o necessário');
    h += '<section class="card"><h2>Quanto guardar</h2>' + (mStatus ? '<div style="margin-bottom:6px">' + mStatus + '</div>' : '') +
      '<div class="row"><div class="l">Valor total da meta<small>passagens ' + brl(s.ticketsGoal) + ' + gastos na viagem ' + brl(s.spendGoal) + '</small></div><div class="v">' + brl(tr.goal) + '</div></div>' +
      '<div class="row"><div class="l">Já economizado</div><div class="v">' + brl(tr.saved) + '</div></div>' +
      '<div class="row"><div class="l">Quanto falta</div><div class="v">' + brl(tr.remaining) + '</div></div>' +
      '<div class="row"><div class="l">Meta mensal de economia<small>definida por você</small></div><div class="v">' + brl(s.monthlyGoal) + '</div></div>' +
      (tr.done ? '' : '<div class="row"><div class="l">Preciso guardar por mês<small>para fechar no prazo</small></div><div class="v">' + needTxt + '</div></div>' +
        '<div class="row"><div class="l">Preciso guardar por semana<small>com ' + String(s.weeks).replace('.', ',') + ' semanas por mês</small></div><div class="v">' + (tr.needWeek == null ? '—' : brl(tr.needWeek)) + '</div></div>') + '</section>';

    function daysTxt(n) { return n < 0 ? 'prazo vencido' : (n === 0 ? 'hoje' : n + (n === 1 ? ' dia' : ' dias')); }
    h += '<section class="card"><h2>Prazos</h2>' +
      '<div class="row"><div class="l">Comprar as passagens até<small>' + (tr.ticketsDone ? 'valor das passagens já guardado' : (tr.ticketsOverdue ? 'prazo vencido · faltam ' + brl(tr.ticketsRem) : 'faltam ' + brl(tr.ticketsRem) + (tr.needTickets != null ? ' · ' + brl(tr.needTickets) + ' por mês' : ''))) + '</small></div><div class="v">' + R.fmtDate(s.ticketsDeadline) + '</div></div>' +
      '<div class="row"><div class="l">Juntar todo o dinheiro até<small>' + daysTxt(tr.daysToFinal) + '</small></div><div class="v">' + R.fmtDate(s.finalDeadline) + '</div></div></section>';

    var pt = '';
    if (tr.done) pt = 'Meta atingida. Parabéns!';
    else if (pj.month) {
      var late = pj.month > R.mk(s.finalDeadline);
      pt = (pj.basis === 'real' ? 'No seu ritmo real de ' + brl(pj.rate) + ' por mês' : 'Guardando a meta de ' + brl(pj.rate) + ' por mês') + ', o dinheiro fecha em ' + R.monthName(pj.month) + (late ? ' (depois do prazo final).' : '.');
    } else pt = pj.basis === 'real' ? 'No ritmo real de ' + brl(pj.rate) + ' por mês a meta não fecha.' : 'Com a meta mensal atual a meta da viagem não fecha.';
    h += '<section class="card"><h2>Previsão</h2><p style="margin:0">' + esc(pt) + '</p>' + (pj.basis === 'plan' && !tr.done ? '<p class="hint" style="margin:8px 0 0">Ainda não há meses completos de registro. Depois do primeiro mês, a previsão passa a usar quanto você realmente guardou.</p>' : '') + '</section>';

    h += '<section class="card"><h2>Dinheiro da viagem</h2>' +
      '<div class="row"><div class="l">Guardado para a viagem</div><div class="v">' + brl(tr.saved) + '</div></div>' +
      '<div class="row"><div class="l">Já gasto da viagem<small>despesas na categoria “' + R.FUND_CAT + '”</small></div><div class="v">' + brl(tr.spent) + '</div></div>' +
      '<div class="row total"><div class="l">Ainda em mãos para a viagem</div><div class="v' + neg(tr.inFund) + '">' + brl(tr.inFund) + '</div></div>' +
      '<p class="hint" style="margin:8px 0 0">Despesas dessa categoria saem do dinheiro guardado, não do salário do mês.</p></section>';

    h += '<div class="btn-row"><button class="btn primary" data-act="newSaving">' + svg('plus', 18) + 'Guardei dinheiro</button><button class="btn ghost" data-act="editGoal">Editar meta e prazos</button></div>';

    var dep = state.savings.filter(function (x) { return x.dest !== 'reserva'; }).sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    h += '<section class="card"><h2>Depósitos para a viagem</h2>' + (dep.length ? '<div class="list">' + dep.map(function (x) {
      return '<button class="item" data-act="editMv" data-k="sv" data-id="' + esc(x.id) + '"><span class="body"><div class="t">' + esc(x.desc || 'Guardado para a viagem') + '</div><div class="m">' + R.fmtDate(x.date) + '</div></span><span class="amt">' + brl(x.amount) + '</span></button>';
    }).join('') + '</div>' : '<div class="empty">Nenhum depósito ainda. Quando separar dinheiro para o Chile, toque em “Guardei dinheiro”.</div>') + '</section>';
    return h;
  }

  /* ================= PLANO ================= */
  function niceCeil(v) {
    if (v <= 0) return 100;
    var p = Math.pow(10, Math.floor(Math.log10(v))), f = v / p;
    return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
  }
  function topRoundedBar(x, y, w, h, r) {
    if (h < 1) return '';
    r = Math.min(r, h, w / 2);
    return 'M' + x + ',' + (y + h) + 'L' + x + ',' + (y + r) + 'Q' + x + ',' + y + ' ' + (x + r) + ',' + y + 'L' + (x + w - r) + ',' + y + 'Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + r) + 'L' + (x + w) + ',' + (y + h) + 'Z';
  }
  function shortM(M) { return R.MS[Number(M.split('-')[1]) - 1]; }

  function barChart(rows, sel) {
    var W = 360, H = 210, pl = 46, pr = 6, pt = 10, pb = 26, iw = W - pl - pr, ih = H - pt - pb;
    var mx = niceCeil(Math.max.apply(null, rows.map(function (r) { return Math.max(r.planned, r.goal, r.saved); }).concat([1])));
    function y(v) { return pt + ih - (v / mx) * ih; }
    var gw = iw / rows.length, bw = Math.max(4, Math.floor((gw - 8) / 3) - 2), o = '';
    [0, mx / 2, mx].forEach(function (t) {
      o += '<line class="' + (t === 0 ? 'axis' : 'grid') + '" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(t) + '" y2="' + y(t) + '"/><text x="' + (pl - 6) + '" y="' + (y(t) + 4) + '" text-anchor="end" font-size="11">' + R.brlShort(t) + '</text>';
    });
    rows.forEach(function (r, i) {
      var gx = pl + i * gw, cx = gx + gw / 2, bx = cx - (3 * bw + 4) / 2, on = r.M === sel;
      if (on) o += '<rect x="' + (gx + 1) + '" y="' + pt + '" width="' + (gw - 2) + '" height="' + ih + '" rx="6" fill="var(--accent-soft)"/>';
      [[r.planned, 's1'], [r.goal, 's2'], [r.saved, 's3']].forEach(function (b, k) {
        var x = bx + k * (bw + 2), h = (b[0] / mx) * ih;
        o += '<path d="' + topRoundedBar(x, pt + ih - h, bw, h, 3) + '" fill="var(--' + b[1] + ')"/>';
      });
      o += '<text x="' + cx + '" y="' + (H - 8) + '" text-anchor="middle" font-size="11.5"' + (on ? ' style="font-weight:700;fill:var(--ink)"' : '') + '>' + shortM(r.M) + '</text>';
      o += '<rect class="hit" data-act="chartSel" data-m="' + r.M + '" x="' + gx + '" y="0" width="' + gw + '" height="' + H + '"/>';
    });
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Despesas previstas, meta de guardar e valor guardado em cada mês">' + o + '</svg>';
  }

  function lineChart(rows, goal, sel) {
    var W = 360, H = 210, pl = 46, pr = 14, pt = 22, pb = 26, iw = W - pl - pr, ih = H - pt - pb, n = rows.length;
    var all = [goal];
    rows.forEach(function (r) { all.push(r.cumPlan); if (r.cumAct != null) all.push(r.cumAct); if (r.cumFc != null) all.push(r.cumFc); });
    var mx = niceCeil(Math.max.apply(null, all));
    function x(i) { return n > 1 ? pl + i * (iw / (n - 1)) : pl + iw / 2; }
    function y(v) { return pt + ih - (v / mx) * ih; }
    function path(key) {
      var d = '', pen = false;
      rows.forEach(function (r, i) { if (r[key] == null) { pen = false; return; } d += (pen ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(r[key]).toFixed(1); pen = true; });
      return d;
    }
    var o = '';
    [0, mx / 2, mx].forEach(function (t) {
      o += '<line class="' + (t === 0 ? 'axis' : 'grid') + '" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(t) + '" y2="' + y(t) + '"/><text x="' + (pl - 6) + '" y="' + (y(t) + 4) + '" text-anchor="end" font-size="11">' + R.brlShort(t) + '</text>';
    });
    o += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(goal) + '" y2="' + y(goal) + '" stroke="var(--ink-2)" stroke-width="1.5" stroke-dasharray="2 4"/><text x="' + (W - pr) + '" y="' + (y(goal) - 6) + '" text-anchor="end" font-size="11.5" style="fill:var(--ink)">Meta ' + R.brlShort(goal) + '</text>';
    var si = -1; rows.forEach(function (r, i) { if (r.M === sel) si = i; });
    if (si >= 0) o += '<line x1="' + x(si) + '" x2="' + x(si) + '" y1="' + pt + '" y2="' + (pt + ih) + '" stroke="var(--accent)" stroke-width="1.5" opacity=".5"/>';
    o += '<path d="' + path('cumPlan') + '" fill="none" stroke="var(--s1)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
    o += '<path d="' + path('cumFc') + '" fill="none" stroke="var(--s3)" stroke-width="2.5" stroke-dasharray="6 5" stroke-linecap="round"/>';
    o += '<path d="' + path('cumAct') + '" fill="none" stroke="var(--s3)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
    rows.forEach(function (r, i) {
      if (r.cumAct != null) o += '<circle cx="' + x(i) + '" cy="' + y(r.cumAct) + '" r="4" fill="var(--s3)" stroke="var(--surface)" stroke-width="2"/>';
      if (r.M === sel) o += '<circle cx="' + x(i) + '" cy="' + y(r.cumPlan) + '" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>';
      o += '<text x="' + x(i) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="11.5"' + (r.M === sel ? ' style="font-weight:700;fill:var(--ink)"' : '') + '>' + shortM(r.M) + '</text>';
      var cw = n > 1 ? iw / (n - 1) : iw;
      o += '<rect class="hit" data-act="chartSel" data-m="' + r.M + '" x="' + (x(i) - cw / 2) + '" y="0" width="' + cw + '" height="' + H + '"/>';
    });
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Evolução do dinheiro guardado para o Chile comparada com o planejado e com a meta total">' + o + '</svg>';
  }

  function monthStatus(st) {
    var diff = R.r2(st.savedTrip - st.goal);
    if (st.goal <= 0) return { k: 'neutral', t: 'Sem meta' };
    if (diff > 0.004) return { k: 'good', t: 'Acima da meta (+' + brl(diff) + ')' };
    if (diff >= -0.004) return { k: 'good', t: 'Meta cumprida' };
    if (!st.feasible) return { k: 'bad', t: 'Meta maior que o disponível' };
    if (st.rel === 'past') return { k: 'bad', t: 'Abaixo da meta (−' + brl(-diff) + ')' };
    if (st.rel === 'current') return { k: 'warn', t: 'Faltam ' + brl(-diff) };
    return { k: 'info', t: 'Planejado' };
  }

  function viewPlan() {
    var td = today(), s = state.settings, months = R.planMonths(state), rows = R.chartSeries(state, td);
    var sel = ui.chartSel && months.indexOf(ui.chartSel) >= 0 ? ui.chartSel : (months.indexOf(ui.month) >= 0 ? ui.month : months[0]);
    var r = rows.filter(function (x) { return x.M === sel; })[0] || rows[0];
    var goal = R.r2(Number(s.ticketsGoal) + Number(s.spendGoal));
    function swatch(c) { return '<span><i style="background:var(--' + c + ')"></i>'; }

    var h = '<section class="card"><h2>Despesas e economia por mês</h2>' + barChart(rows, sel) +
      '<div class="chart-legend">' + swatch('s1') + 'Despesas previstas</span>' + swatch('s2') + 'Meta de guardar</span>' + swatch('s3') + 'Guardei</span></div>' +
      '<div class="chart-read"><b>' + esc(R.monthName(r.M)) + '</b>Despesas ' + brl(r.planned) + ' · meta de guardar ' + brl(r.goal) + ' · guardei ' + brl(r.saved) + '</div></section>';

    h += '<section class="card"><h2>Evolução da meta</h2>' + lineChart(rows, goal, sel) +
      '<div class="chart-legend">' + swatch('s1') + 'Planejado</span>' + swatch('s3') + 'Guardado de verdade</span><span><i style="background:none;border-top:2px dashed var(--s3);border-radius:0;height:0;width:14px"></i>Previsão</span></div>' +
      '<div class="chart-read"><b>' + esc(R.monthName(r.M)) + '</b>Planejado até aqui ' + brl(r.cumPlan) + ' · ' + (r.cumAct != null ? 'guardado ' + brl(r.cumAct) : 'ainda sem registro neste mês') + (r.cumFc != null && r.cumAct == null ? ' · previsão ' + brl(r.cumFc) : '') + '</div></section>';

    h += '<p class="sub" style="margin:2px 4px 0">Toque em um mês para ajustar o salário e a meta daquele mês.</p>';
    months.forEach(function (M) {
      var st = R.monthStats(state, M, td), ms = monthStatus(st);
      h += '<button class="card mcard' + (M === ui.month ? ' sel' : '') + '" data-act="monthAdj" data-m="' + M + '"><div class="hd"><h3>' + esc(R.monthName(M).replace(/^./, function (c) { return c.toUpperCase(); })) + '</h3>' + pill(ms.k, ms.t) + '</div>' +
        '<dl class="mgrid" style="margin-bottom:0">' +
        '<div><dt>Salário previsto' + (st.plannedSalary !== Number(s.salary) ? ' (ajustado)' : '') + '</dt><dd>' + brl(st.plannedSalary) + '</dd></div>' +
        '<div><dt>Despesas previstas</dt><dd>' + brl(st.planned) + '</dd></div>' +
        '<div><dt>Despesas pagas</dt><dd>' + brl(st.paid) + '</dd></div>' +
        '<div><dt>Pretendo guardar' + (R.planFor(state, M).customGoal ? ' (ajustado)' : '') + '</dt><dd>' + brl(st.goal) + '</dd></div>' +
        '<div><dt>Realmente guardei</dt><dd>' + brl(st.savedTrip) + '</dd></div>' +
        '<div><dt>Saldo restante</dt><dd class="' + neg(st.free).trim() + '">' + brl(st.free) + '</dd></div></dl></button>';
    });
    return h;
  }

  /* ================= MAIS ================= */
  function numField(label, key, val, hint) {
    return '<div class="field"><label for="s_' + key + '">' + label + '</label><input class="inp" id="s_' + key + '" inputmode="decimal" autocomplete="off" data-set="' + key + '" value="' + esc(val) + '">' + (hint ? '<span class="hint">' + hint + '</span>' : '') + '</div>';
  }

    h += '<section class="card"><h2>Categorias</h2><div class="chips">' + state.cats.map(function (c) {
      var custom = R.DEFAULT_CATS.indexOf(c) < 0;
      return '<span class="chip" style="display:inline-flex;align-items:center;gap:6px">' + esc(c) + (custom && !used[c] ? '<button data-act="delCat" data-c="' + esc(c) + '" aria-label="Excluir categoria ' + esc(c) + '" style="display:grid;place-items:center">' + svg('x', 14) + '</button>' : '') + '</span>';
    }).join('') + '</div><div style="display:flex;gap:10px;margin-top:12px"><input class="inp" id="newCat" placeholder="Nova categoria" maxlength="30" autocomplete="off"><button class="btn" data-act="addCat">Adicionar</button></div></section>';

    h += rtCard();

      '<p class="hint" style="margin:10px 0 12px">Tudo o que você registra é salvo na hora. Quando o app abre dentro da sua conta, os dados ficam guardados nela e também neste aparelho. Sem a conta, ficam só neste aparelho e podem sumir se você limpar os dados do navegador, então faça um backup de vez em quando.</p>' +
      '<div class="btn-row"><button class="btn" data-act="backup">Backup e restauração</button><button class="btn danger" data-act="reset">Apagar tudo</button></div></section>';
    return h;
  }

  /* ================= painéis inferiores ================= */
  function openSheet(kind, data) { ui.sheet = { kind: kind, data: data || {} }; renderSheet(); }
  function closeSheet() { ui.sheet = null; $('#sheet').hidden = true; $('#scrim').hidden = true; $('#sheet').innerHTML = ''; }
  function collect() {
    if (!ui.sheet) return;
    document.querySelectorAll('#sheet [data-f]').forEach(function (el) { ui.sheet.data[el.dataset.f] = el.value; });
  }
  function shHead(t) { return '<div class="grab"></div><div class="hd"><h3>' + esc(t) + '</h3><button class="x" data-act="close" aria-label="Fechar">' + svg('x', 20) + '</button></div>'; }
  function inp(f, label, val, o) {
    o = o || {};
    return '<div class="field"><label for="f_' + f + '">' + label + '</label><input class="inp' + (o.cls ? ' ' + o.cls : '') + '" id="f_' + f + '" data-f="' + f + '" ' + (o.type ? 'type="' + o.type + '"' : 'inputmode="' + (o.mode || 'text') + '"') + ' autocomplete="off" value="' + esc(val == null ? '' : val) + '"' + (o.ph ? ' placeholder="' + esc(o.ph) + '"' : '') + '>' + (o.hint ? '<span class="hint">' + o.hint + '</span>' : '') + '</div>';

  function segBtns(k, cur, opts) {

  }
  function delBlock(d, label) {
    if (!d.id) return '';

  }

        inp('amount', 'Valor (R$)', d.amount, { cls: 'money', mode: 'decimal', ph: '0,00' }) +

        (d.cat === R.FUND_CAT ? '<span class="hint">Sai do dinheiro guardado para a viagem, não do salário do mês.</span>' : '') + '</div>' +

        '<details' + (d.moreOpen ? ' open' : '') + '><summary>Mais opções</summary><div class="stack"><div class="field"><span class="lbl">Tipo</span>' + segBtns('type', d.type, [['variavel', 'Variável'], ['fixa', 'Fixa']]) + '</div>' +
        sw(!!d.estimate, 'flip', 'data-k="estimate"', 'Valor ainda é uma estimativa') +

        inp('note', 'Observação (opcional)', d.note, {}) + '</div></details>' +
        (d.recId && !d.id ? '<p class="hint" style="margin:0">Ao salvar, este valor passa a valer só para este mês.</p>' : '') +
        '<div class="err" id="sheetErr" role="alert"></div><button class="btn primary block" data-act="saveExpense">Salvar</button>' + delBlock(d, d.recId ? 'Voltar ao valor previsto' : 'Excluir despesa');
    } else if (sh.kind === 'income') {

        '<div class="field"><span class="lbl">Para onde foi</span>' + segBtns('dest', d.dest, [['viagem', 'Viagem ao Chile'], ['reserva', 'Reserva geral']]) + '</div>' +
        inp('date', 'Data', d.date, { type: 'date' }) + inp('desc', 'Observação (opcional)', d.desc, {}) +

        '<div class="err" id="sheetErr" role="alert"></div><div class="btn-row"><button class="btn primary" data-act="copyBackup">Copiar</button><button class="btn ' + (d.confirmRestore ? 'danger' : 'ghost') + '" data-act="restore">' + (d.confirmRestore ? 'Toque de novo para substituir' : 'Restaurar do texto') + '</button></div>';
    } else if (sh.kind === 'invite') {
      h = shHead('Link de convite') +
        '<p class="sub" style="margin:0">Abra este link em outro aparelho (no Chrome) para ver e editar os mesmos dados. Quem tiver o link acessa tudo, então envie só para quem você confia.</p>' +

  /* ================= salvar ================= */
  function afterSave(date, msg) {

  function saveExpense() {
    collect(); var d = ui.sheet.data, amount = R.parseBR(d.amount);
    if (isNaN(amount) || amount < 0 || (amount === 0 && !d.recId)) return sheetErr('Digite um valor maior que zero.');

  /* ================= sincronização entre aparelhos (Firebase Realtime Database via REST) ================= */
  var RTKEY = 'rumo-ao-chile:rt';

  var rt = null, rtSynced = null, rtFirst = true, rtBusy = false, rtAgain = false, rtTimer = null, rtES = null, rtDefer = false, rtPoll = null;

  function normUrl(u) { try { return new URL(String(u || '').trim()).origin; } catch (e) { return ''; } }
  function rtOk(c) {

      (/^https:\/\/[a-z0-9-]+(\.[a-z0-9-]+)*\.(firebaseio\.com|firebasedatabase\.app)$/i.test(c.url) || /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(c.url)) &&

  function rtSave() { try { if (rt) localStorage.setItem(RTKEY, JSON.stringify(rt)); else localStorage.removeItem(RTKEY); } catch (e) { /* ok */ } }
  function newRoom() {

  }

  function j(x) { return x === undefined ? undefined : JSON.parse(JSON.stringify(x)); }
  function canon(v) {

  }

  function toShape(S) {
    var o = { settings: {}, plan: {}, cats: {}, expenses: {}, incomes: {}, savings: {}, recurring: {} };
    Object.keys(S.settings).forEach(function (k) { o.settings[k] = S.settings[k]; });
    Object.keys(S.plan).forEach(function (k) { o.plan[k] = S.plan[k]; });
    S.cats.forEach(function (c) { o.cats[ckey(c)] = c; });
    ['expenses', 'incomes', 'savings', 'recurring'].forEach(function (c) { S[c].forEach(function (x) { o[c][x.id] = x; }); });
    return o;
  }
  function applyShape(F) {
    var d = R.defaultState();
    state.settings = Object.assign({}, d.settings, F.settings);
    state.plan = F.plan;
    var names = Object.keys(F.cats).map(function (k) { return F.cats[k]; });
    var keep = state.cats.filter(function (c) { return names.indexOf(c) >= 0; });
    names.forEach(function (c) { if (keep.indexOf(c) < 0) keep.push(c); });
    if (keep.indexOf(R.FUND_CAT) < 0) keep.push(R.FUND_CAT);
    state.cats = keep;
    ['expenses', 'incomes', 'savings', 'recurring'].forEach(function (c) {
      var m = F[c], seen = {}, arr = [];
      state[c].forEach(function (x) { if (m[x.id]) { arr.push(m[x.id]); seen[x.id] = 1; } });
      Object.keys(m).sort().forEach(function (id) { if (!seen[id]) arr.push(m[id]); });

  function rtFetch(path, opt) {

        rtSynced = {};

        try { localStorage.setItem('rumo-ao-chile:rt-synced:' + room, JSON.stringify(ns)); } catch (e) { /* ok */ }
        setSync('rt-live');
      });
    }).catch(function (e) {
      setSync(/http 40[13]/.test(String(e && e.message)) ? 'rt-denied' : 'rt-offline');

    }).then(function () {

    });
  }
