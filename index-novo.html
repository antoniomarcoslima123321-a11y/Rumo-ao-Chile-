<title>Rumo aos Meus Sonhos</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: coluna única de celular, cabeçalho fixo com mês, navegação inferior de 5 abas e botão + flutuante.
   Cores: neutros azulados (gelo/noite), azul glacial como acento, séries do gráfico e status em tokens separados. */
:root {
  --bg: #F2F5F9;
  --surface: #FFFFFF;
  --surface-2: #E9EEF5;
  --ink: #0E1A2B;
  --ink-2: #44546A;
  --muted: #66748A;
  --line: #DCE3EC;
  --accent: #14558F;
  --accent-ink: #FFFFFF;
  --accent-soft: #E1EDF8;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --good-fg: #0B6B2E; --good-bg: #E3F4E8;
  --warn-fg: #8A5A00; --warn-bg: #FFF1D6;
  --bad-fg: #B02A2A;  --bad-bg: #FBE4E4;
  --info-fg: #14558F; --info-bg: #E1EDF8;
  --shadow: 0 1px 2px rgba(14, 26, 43, .06), 0 6px 18px rgba(14, 26, 43, .06);
  --f-display: 'Bricolage Grotesque', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #09111D; --surface: #111C2C; --surface-2: #18263A; --ink: #E7EEF7; --ink-2: #A9B7C9;
    --muted: #8696AB; --line: #223249; --accent: #5DB4F0; --accent-ink: #06213A; --accent-soft: #12304A;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --good-fg: #5BD686; --good-bg: #12301E; --warn-fg: #F2B94B; --warn-bg: #3A2B0B;
    --bad-fg: #FF9A9A; --bad-bg: #3D1717; --info-fg: #8CCBF5; --info-bg: #12304A;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 18px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #09111D; --surface: #111C2C; --surface-2: #18263A; --ink: #E7EEF7; --ink-2: #A9B7C9;
  --muted: #8696AB; --line: #223249; --accent: #5DB4F0; --accent-ink: #06213A; --accent-soft: #12304A;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --good-fg: #5BD686; --good-bg: #12301E; --warn-fg: #F2B94B; --warn-bg: #3A2B0B;
  --bad-fg: #FF9A9A; --bad-bg: #3D1717; --info-fg: #8CCBF5; --info-bg: #12304A;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 18px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 15px/1.45 var(--f-body);
  min-height: 100%;
  overflow-x: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 10; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

    return isFinite(v) ? v : NaN;
  }
  function toInput(n) { return (Number(n) || 0).toFixed(2).replace('.', ','); }

  /* ---------- estado inicial ---------- */
  function defaultState() {
    return {
      v: 1,
      updated: 0,
      settings: {
        salary: 1000,
        fare: 7.6,
        uber: 4,
        days: 3,
        weeks: 4.33,
        monthlyGoal: 500,
        startMonth: '2026-11',
        ticketsGoal: 1500,
        spendGoal: 2000,
        ticketsDeadline: '2027-05-31',
        finalDeadline: '2027-06-30',
        goalName: 'Viagem para o Chile',
        goalType: 'viagem'
      },
      recurring: [
        { id: 'r_transp', name: 'Transporte para o trabalho', cat: 'Transporte', kind: 'transport', amount: 0, active: true, confirmed: true },
        { id: 'r_food', name: 'Alimentação', cat: 'Alimentação', kind: 'fixed', amount: 100, active: true, confirmed: true },
        { id: 'r_net', name: 'Internet', cat: 'Internet', kind: 'fixed', amount: 100, active: false, confirmed: false }
      ],
      cats: DEFAULT_CATS.slice(),
      expenses: [],
      incomes: [],
      savings: [],
      plan: {}
    };
  }

  function migrate(s) {
    var d = defaultState();
    if (!s || typeof s !== 'object') return d;
    var out = {
      v: 1,
      updated: Number(s.updated) || 0,
      settings: Object.assign({}, d.settings, s.settings || {}),
      recurring: Array.isArray(s.recurring) ? s.recurring : d.recurring,
      cats: Array.isArray(s.cats) && s.cats.length ? s.cats : d.cats,
      expenses: Array.isArray(s.expenses) ? s.expenses : [],
      incomes: Array.isArray(s.incomes) ? s.incomes : [],
      savings: Array.isArray(s.savings) ? s.savings : [],
      plan: s.plan && typeof s.plan === 'object' ? s.plan : {}
    };
    if (out.cats.indexOf(FUND_CAT) < 0) out.cats.push(FUND_CAT);
    return out;
  }

  /* ---------- despesas do mês ---------- */
  function transportDaily(st) { return r2(Number(st.fare) + Number(st.uber)); }
  function transportMonthly(st) { return r2((Number(st.fare) + Number(st.uber)) * Number(st.days) * Number(st.weeks)); }
  function recAmount(S, r) { return r.kind === 'transport' ? transportMonthly(S.settings) : r2(r.amount); }

  /* Itens do mês = despesas registradas + despesas que se repetem e ainda não foram registradas
     naquele mês. Se uma recorrente já foi registrada (recId), ela substitui a prevista: nunca conta 2x. */
  function monthItems(S, M) {
    var items = [];
    var regs = S.expenses.filter(function (e) { return mk(e.date) === M; });
    var used = {};
    regs.forEach(function (e) { if (e.recId) used[e.recId] = true; });
    if (M >= S.settings.startMonth) {
      S.recurring.forEach(function (r) {
        if (!r.active || used[r.id]) return;
        items.push({
          virtual: true, id: 'v_' + r.id + '_' + M, recId: r.id, name: r.name, cat: r.cat,
          amount: recAmount(S, r), type: 'fixa', status: 'pendente', confirmed: r.confirmed !== false,
          date: M + '-01', note: ''
        });
      });
    }
    regs.forEach(function (e) {
      items.push({
        virtual: false, id: e.id, recId: e.recId, name: e.name, cat: e.cat, amount: r2(e.amount),
        type: e.type, status: e.status, confirmed: e.confirmed !== false, date: e.date, note: e.note || ''
      });
    });
    return items;
  }

  function planFor(S, M) {
    var p = S.plan[M] || {};
    var started = M >= S.settings.startMonth;
    var hasS = p.salary != null && p.salary !== '', hasG = p.goal != null && p.goal !== '';
    return {
      salary: hasS ? Number(p.salary) : (started ? Number(S.settings.salary) : 0),
      goal: hasG ? Number(p.goal) : (started ? Number(S.settings.monthlyGoal) : 0),
      customSalary: hasS, customGoal: hasG
    };
  }

  function monthStats(S, M, today) {
    var cur = mk(today || todayStr());
    var items = monthItems(S, M);
    // Despesas "Viagem para o Chile" saem do dinheiro guardado da viagem, não do salário.
    var budget = items.filter(function (i) { return i.cat !== FUND_CAT; });
    var fund = items.filter(function (i) { return i.cat === FUND_CAT; });
    var planned = r2(sum(budget, function (i) { return i.amount; }));
    var paid = r2(sum(budget.filter(function (i) { return i.status === 'paga'; }), function (i) { return i.amount; }));
    var estimates = r2(sum(budget.filter(function (i) { return !i.confirmed; }), function (i) { return i.amount; }));
    var fundPaid = r2(sum(fund.filter(function (i) { return i.status === 'paga'; }), function (i) { return i.amount; }));
    var received = r2(sum(S.incomes.filter(function (x) { return mk(x.date) === M; }), function (x) { return x.amount; }));
    var sv = S.savings.filter(function (x) { return mk(x.date) === M; });
    var savedTrip = r2(sum(sv.filter(function (x) { return x.dest !== 'reserva'; }), function (x) { return x.amount; }));
    var savedReserve = r2(sum(sv.filter(function (x) { return x.dest === 'reserva'; }), function (x) { return x.amount; }));
    var savedAll = r2(savedTrip + savedReserve);
    var pl = planFor(S, M);
    var available = r2(received - paid - savedAll);
    var incomeRef = Math.max(received, pl.salary);
    var margin = r2(incomeRef - planned);
    var free = r2(margin - Math.max(pl.goal, savedAll));
    return {
      M: M, rel: M > cur ? 'future' : (M === cur ? 'current' : 'past'),
      items: items, planned: planned, paid: paid, pending: r2(planned - paid), estimates: estimates,
      fundPaid: fundPaid, received: received, plannedSalary: pl.salary, goal: pl.goal,
      savedTrip: savedTrip, savedReserve: savedReserve, savedAll: savedAll,
      available: available, incomeRef: incomeRef, margin: margin, free: free,
      feasible: pl.goal <= 0 || margin >= pl.goal
    };
  }

  function catTotals(S, M) {
    var map = {};
    monthItems(S, M).forEach(function (i) {
      var c = map[i.cat] || (map[i.cat] = { cat: i.cat, total: 0, paid: 0 });
      c.total = r2(c.total + i.amount);
      if (i.status === 'paga') c.paid = r2(c.paid + i.amount);
    });
    return Object.keys(map).map(function (k) { return map[k]; })
      .filter(function (c) { return c.total > 0; })
      .sort(function (a, b) { return b.total - a.total; });
  }

  /* ---------- viagem ---------- */
  function refMonth(S, today) { return maxMonth(mk(today || todayStr()), S.settings.startMonth); }

  function tripStats(S, today) {
    today = today || todayStr();
    var st = S.settings;
    var goal = r2(Number(st.ticketsGoal) + Number(st.spendGoal));
    var trip = S.savings.filter(function (x) { return x.dest !== 'reserva'; });
    var saved = r2(sum(trip, function (x) { return x.amount; }));
    var spent = r2(sum(S.expenses.filter(function (e) { return e.cat === FUND_CAT && e.status === 'paga'; }), function (e) { return e.amount; }));
    var R = refMonth(S, today);
    var remaining = r2(Math.max(0, goal - saved));
    var ticketsRem = r2(Math.max(0, Number(st.ticketsGoal) - saved));
    var mTickets = Math.max(0, monthDiff(R, mk(st.ticketsDeadline)) + 1);
    var mFinal = Math.max(0, monthDiff(R, mk(st.finalDeadline)) + 1);
    var needTickets = ticketsRem <= 0 ? 0 : (mTickets > 0 ? ticketsRem / mTickets : Infinity);
    var needFinal = remaining <= 0 ? 0 : (mFinal > 0 ? remaining / mFinal : Infinity);
    var needMonth = Math.max(needTickets, needFinal);
    var weeks = Number(st.weeks) || 4.33;
    var from = today > R + '-01' ? today : R + '-01';
    return {
      goal: goal, saved: saved, spent: spent, inFund: r2(saved - spent), remaining: remaining,
      pct: goal > 0 ? Math.min(100, (saved / goal) * 100) : 0,
      ticketsMark: goal > 0 ? (Number(st.ticketsGoal) / goal) * 100 : 0,
      ticketsRem: ticketsRem, ticketsDone: ticketsRem <= 0,
      refMonth: R, monthsToTickets: mTickets, monthsToFinal: mFinal,
      needTickets: isFinite(needTickets) ? r2(needTickets) : null,
      needFinal: isFinite(needFinal) ? r2(needFinal) : null,
      needMonth: isFinite(needMonth) ? r2(needMonth) : null,
      needWeek: isFinite(needMonth) ? r2(needMonth / weeks) : null,
      daysToTickets: daysBetween(from, st.ticketsDeadline),
      daysToFinal: daysBetween(from, st.finalDeadline),
      ticketsOverdue: ticketsRem > 0 && mTickets === 0,
      finalOverdue: remaining > 0 && mFinal === 0,
      done: goal > 0 && saved >= goal
    };
  }

  function savedTripIn(S, M) {
    return r2(sum(S.savings.filter(function (x) { return x.dest !== 'reserva' && mk(x.date) === M; }), function (x) { return x.amount; }));
  }

  /* Ritmo real = média guardada por mês completo (do início do plano até o mês anterior ao atual). */
  function paceReal(S, today) {
    var cur = mk(today || todayStr());
    var n = monthDiff(S.settings.startMonth, cur);
    if (n < 1) return null;
    var tot = sum(S.savings.filter(function (x) { return x.dest !== 'reserva' && mk(x.date) < cur; }), function (x) { return x.amount; });
    return r2(tot / n);
  }

  /* Simula mês a mês quando a meta fecha. rateFn(M) = quanto se guarda em cada mês. */
  function simulate(S, today, rateFn) {
    var t = tripStats(S, today);
    if (t.done) return { done: true, month: null };
    var cum = t.saved, R = t.refMonth;
    for (var i = 0; i < 120; i++) {
      var M = addMonths(R, i);
      var add = rateFn(M);
      if (i === 0) add = Math.max(0, add - savedTripIn(S, M));
      cum += add;
      if (cum >= t.goal - 0.005) return { done: false, month: M };
    }
    return { done: false, month: null };
  }

  function projection(S, today) {
    var pace = paceReal(S, today);
    if (pace != null) {
      var a = simulate(S, today, function () { return pace; });
      return { basis: 'real', rate: pace, done: a.done, month: a.month };
    }
    var p = simulate(S, today, function (M) { return planFor(S, M).goal; });
    return { basis: 'plan', rate: Number(S.settings.monthlyGoal), done: p.done, month: p.month };
  }

  /* ---------- planejamento ---------- */
  function monthList(S) {
    var all = [S.settings.startMonth, mk(S.settings.finalDeadline), mk(S.settings.ticketsDeadline)];
    S.expenses.concat(S.incomes, S.savings).forEach(function (x) { if (x.date) all.push(mk(x.date)); });
    all.sort();
    return monthRange(all[0], all[all.length - 1]);
  }
  function planMonths(S) { return monthRange(S.settings.startMonth, mk(S.settings.finalDeadline)); }

  function chartSeries(S, today) {
    var cur = mk(today || todayStr());
    var months = planMonths(S);
    var cumPlan = 0, cumAct = 0, rows = [];
    // economias anteriores ao início do plano contam como já guardadas
    cumAct = sum(S.savings.filter(function (x) { return x.dest !== 'reserva' && mk(x.date) < months[0]; }), function (x) { return x.amount; });
    months.forEach(function (M) {
      var st = monthStats(S, M, today);
      cumPlan = r2(cumPlan + st.goal);
      cumAct = r2(cumAct + st.savedTrip);
      rows.push({ M: M, planned: st.planned, goal: st.goal, saved: st.savedTrip, paid: st.paid,
        cumPlan: cumPlan, cumAct: M <= cur ? cumAct : null, cumFc: null });
    });
    // previsão: parte do real acumulado até o mês atual e segue com as metas planejadas
    var base = 0, lastIdx = -1;
    rows.forEach(function (r, i) { if (r.cumAct != null) lastIdx = i; });
    if (lastIdx >= 0) {
      base = rows[lastIdx].cumAct;
      rows[lastIdx].cumFc = base;
      for (var i = lastIdx + 1; i < rows.length; i++) { base = r2(base + rows[i].goal); rows[i].cumFc = base; }
    }
    return rows;
  }

  /* ---------- avisos (só com os números registrados) ---------- */
  function alerts(S, M, today) {
    today = today || todayStr();
    var out = [];
    var st = monthStats(S, M, today), tr = tripStats(S, today), pj = projection(S, today);
    var name = monthName(M), only = monthOnly(M);
    var started = M >= S.settings.startMonth;

    if (tr.done) out.push({ kind: 'good', text: 'Meta atingida: você já guardou ' + brl(tr.saved) + ' dos ' + brl(tr.goal) + '.' });
    else if (tr.saved > 0) out.push({ kind: 'good', text: 'Você já guardou ' + Math.floor(tr.pct) + '% da sua meta (' + brl(tr.saved) + ' de ' + brl(tr.goal) + ').' });
    else out.push({ kind: 'info', text: 'Você ainda não guardou nada para a meta. Para chegar na meta, o ritmo é de ' + (tr.needMonth != null ? brl(tr.needMonth) : '—') + ' por mês.' });

    if (started && st.goal > 0) {
      if (!st.feasible) out.push({ kind: 'bad', text: 'Sua meta de guardar ' + brl(st.goal) + ' em ' + only + ' é maior do que o dinheiro disponível: depois das despesas sobram ' + brl(Math.max(0, st.margin)) + '.' });
      else out.push({ kind: 'ok', text: 'Guardar ' + brl(st.goal) + ' em ' + only + ' é possível: depois das despesas previstas sobram ' + brl(st.margin) + ', e ' + brl(Math.max(0, st.free)) + ' ficam livres.' });
    }

    if (!tr.done) {
      if (pj.month) {
        var late = pj.month > mk(S.settings.finalDeadline);
        var basis = pj.basis === 'real' ? 'no seu ritmo real de ' + brl(pj.rate) + ' por mês' : 'guardando a meta de ' + brl(pj.rate) + ' por mês';
        out.push({ kind: late ? 'warn' : 'ok', text: (late ? 'Atenção: ' : 'Se continuar economizando assim, ') + basis + ', a meta será atingida em ' + monthName(pj.month) + (late ? ', depois do prazo final.' : '.') });
      } else if (pj.basis === 'real') {
        out.push({ kind: 'warn', text: 'No seu ritmo real de ' + brl(pj.rate) + ' por mês, a meta não fecha. Registre o que guardar ou ajuste a meta.' });
      }
    }

    if (tr.ticketsRem > 0) {
      if (tr.ticketsOverdue) out.push({ kind: 'bad', text: 'O prazo das passagens (' + fmtDate(S.settings.ticketsDeadline) + ') já passou e ainda faltam ' + brl(tr.ticketsRem) + '.' });
      else out.push({ kind: 'info', text: 'Você ainda precisa juntar ' + brl(tr.ticketsRem) + ' para comprar as passagens até ' + monthName(mk(S.settings.ticketsDeadline)) + '.' });
    }

    var planGoal = Number(S.settings.monthlyGoal);
    if (!tr.done && tr.needMonth != null && tr.needMonth > planGoal + 0.005) {
      out.push({ kind: 'warn', text: 'Para fechar a meta no prazo é preciso guardar ' + brl(tr.needMonth) + ' por mês, mais que os ' + brl(planGoal) + ' planejados.' });
    }

    var prev = addMonths(M, -1);
    var curT = (catTotals(S, M).filter(function (c) { return c.cat === 'Transporte'; })[0] || { total: 0 }).total;
    var prevT = (catTotals(S, prev).filter(function (c) { return c.cat === 'Transporte'; })[0] || { total: 0 }).total;
    if (prevT > 0 && curT > prevT + 0.005) out.push({ kind: 'warn', text: 'Você gastou mais com transporte em ' + only + ': ' + brl(curT) + ', ' + brl(curT - prevT) + ' a mais que em ' + monthOnly(prev) + '.' });

    if (st.estimates > 0) {
      var names = st.items.filter(function (i) { return !i.confirmed && i.cat !== FUND_CAT; }).map(function (i) { return i.name; });
      out.push({ kind: 'info', text: brl(st.estimates) + ' das despesas de ' + only + ' ainda são estimativas (' + names.join(', ') + ').' });
    }
    if (st.available < -0.005) out.push({ kind: 'warn', text: 'O saldo disponível de ' + only + ' está negativo (' + brl(st.available) + '): você pagou ou guardou mais do que registrou como recebido.' });
    if (started && st.rel !== 'future' && st.received === 0) out.push({ kind: 'info', text: 'Você ainda não registrou o salário de ' + name + '.' });

    var order = { bad: 0, warn: 1, info: 2, ok: 3, good: 3 };
    return out.map(function (a, i) { a.i = i; return a; })
      .sort(function (a, b) { return order[a.kind] - order[b.kind] || a.i - b.i; });
  }

  /* ---------- operações (cadastrar / editar / excluir) ---------- */
  function upsert(list, obj) {
    if (!obj.id) obj.id = uid();
    for (var i = 0; i < list.length; i++) if (list[i].id === obj.id) { list[i] = obj; return obj; }
    list.push(obj);
    return obj;
  }
  function removeById(list, id) {
    for (var i = 0; i < list.length; i++) if (list[i].id === id) { list.splice(i, 1); return true; }
    return false;
  }
  function togglePaid(S, item, dateIfNew) {
    if (item.virtual) {
      return upsert(S.expenses, {
        id: uid(), name: item.name, amount: item.amount, cat: item.cat, date: dateIfNew,
        type: 'fixa', status: 'paga', confirmed: item.confirmed, note: '', recId: item.recId
      });
    }
    var e = S.expenses.filter(function (x) { return x.id === item.id; })[0];
    if (e) e.status = e.status === 'paga' ? 'pendente' : 'paga';
    return e;
  }

  /* Meses mostrados nos cartões do Plano: do início até o prazo final (ou até o último mês ajustado),
     mais `extra` meses pedidos pela pessoa. Não grava nada: só calcula a lista. */
  function planMonthsFor(S, extra) {
    var end = mk(S.settings.finalDeadline);
    Object.keys(S.plan).forEach(function (k) { if (/^\d{4}-\d{2}$/.test(k) && k > end) end = k; });
    if (extra > 0) end = addMonths(end, extra);
    return monthRange(S.settings.startMonth, end);
  }

  /* ---------- Assistente Financeiro: reconhece perguntas e calcula tudo localmente (sem internet, sem API) ---------- */
  var MONTHS_N = ['janeiro', 'fevereiro', 'marco', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  var WORDN = { um: 1, uma: 1, dois: 2, duas: 2, tres: 3, quatro: 4, cinco: 5, seis: 6, sete: 7, oito: 8, nove: 9, dez: 10, onze: 11, doze: 12 };

  function norm(s) {
    var t = String(s == null ? '' : s).toLowerCase();
    try { t = t.normalize('NFD').replace(/[\u0300-\u036f]/g, ''); } catch (e) { /* sem normalize */ }
    return t;
  }
  function wnum(s) { return WORDN[s] != null ? WORDN[s] : parseFloat(String(s).replace(',', '.')); }
  function mask(t, s, e) { return t.slice(0, s) + new Array(e - s + 1).join(' ') + t.slice(e); }
  function plural(n, a, b) { return n + ' ' + (n === 1 ? a : b); }
  function durTxt(n) {
    if (n < 12) return plural(n, 'mês', 'meses');
    var y = Math.floor(n / 12), m = n % 12, p = [plural(y, 'ano', 'anos')];
    if (m) p.push(plural(m, 'mês', 'meses'));
    return n + ' meses (' + p.join(' e ') + ')';
  }

  /* Separa de uma pergunta: data (mês/ano), prazo (N meses/anos/semanas) e valores em reais. */
  function parseQuestion(raw, Rm, ty) {
    var t = norm(raw), q = { n: t, date: null, dur: null, money: [] };
    var m, mo, y, re;

    // 1) data: dd/mm/aaaa, mm/aaaa, "dezembro de 2027", "dezembro do ano que vem", "fim do ano"
    if ((m = /\b(\d{1,2})\/(\d{1,2})\/(20\d{2})\b/.exec(t))) {
      mo = +m[2]; y = +m[3];
      if (mo >= 1 && mo <= 12) { q.date = y + '-' + pad(mo); t = mask(t, m.index, m.index + m[0].length); }
    } else if ((m = /\b(\d{1,2})\/(20\d{2})\b/.exec(t))) {
      mo = +m[1]; y = +m[2];
      if (mo >= 1 && mo <= 12) { q.date = y + '-' + pad(mo); t = mask(t, m.index, m.index + m[0].length); }
    } else {
      re = new RegExp('\\b(' + MONTHS_N.join('|') + ')\\b(?:\\s*(?:de|do|/)?\\s*(20\\d{2}))?(\\s+(?:do|de)\\s+ano\\s+que\\s+vem)?');
      if ((m = re.exec(t))) {
        mo = MONTHS_N.indexOf(m[1]) + 1;
        if (m[2]) y = +m[2];
        else if (m[3]) y = ty + 1;
        else { y = +Rm.slice(0, 4); if (pad(mo) < Rm.slice(5)) y += 1; }
        q.date = y + '-' + pad(mo);
        t = mask(t, m.index, m.index + m[0].length);
      } else if ((m = /\b(fim|final) do ano\b/.exec(t))) {
        y = ty; if (y + '-12' < Rm) y += 1;
        q.date = y + '-12';
        t = mask(t, m.index, m.index + m[0].length);
      }
    }

    // 2) prazo: "8 meses", "3 anos", "um ano", "10 semanas", "meio ano"
    if ((m = /\b(\d+(?:,\d+)?|um|uma|dois|duas|tres|quatro|cinco|seis|sete|oito|nove|dez|onze|doze)\s+(anos?|meses|mes|semanas?)\b/.exec(t))) {
      var v = wnum(m[1]), u = m[2].charAt(0);
      if (v > 0) {
        if (u === 's') q.dur = { unit: 'w', n: v };
        else q.dur = { unit: 'm', n: Math.max(1, Math.round(u === 'a' ? v * 12 : v)) };
      }
      t = mask(t, m.index, m.index + m[0].length);
    } else if ((m = /\bmeio ano\b/.exec(t))) {
      q.dur = { unit: 'm', n: 6 };
      t = mask(t, m.index, m.index + m[0].length);
    }

    // 3) valores: R$ 1.500 | 1500 reais | R$ 1.250,50 | 250 por mês | 2 mil
    var rm = /(r\$\s*)?(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:[.,]\d{1,2})?)(\s*mil\b)?(\s*(?:reais|real)\b)?(\s*%)?/g, k;
    while ((k = rm.exec(t))) {
      if (k[5]) continue;
      var val = parseBR(k[2]);
      if (isNaN(val)) continue;
      if (k[3]) val *= 1000;
      var after = t.slice(rm.lastIndex, rm.lastIndex + 30), before = t.slice(Math.max(0, k.index - 24), k.index), role = 'plain';
      if (/^\s*(por|ao|a cada|\/)\s*mes\b/.test(after) || /^\s*(mensais|mensal)\b/.test(after)) role = 'month';
      else if (/^\s*(por|ao|a cada|\/)\s*semana\b/.test(after) || /^\s*(semanais|semanal)\b/.test(after)) role = 'week';
      else if (/\bfalt\w*[^\d]{0,14}$/.test(before)) role = 'remaining';

  var ASK_HELP = 'Posso responder com os números do seu app e fazer contas com valores que você escrever. Exemplos:\n' +

    /* ---- em quanto tempo chego na meta guardando X por mês (ou por semana) ---- */

      if (vals.some(function (c) { return c > 0; }) || wv.some(function (c) { return c > 0; })) out.push('Cálculo com depósitos regulares todo mês, começando em ' + monthName(Rm) + ' (este mês conta como o primeiro)' + (wv.length ? ' e ' + wpmTxt + ' semanas por mês' : '') + ', sem rendimentos.');

    /* ---- quanto terei guardando X por mês durante N meses ---- */
    function accumFlow() {

      throw e;
