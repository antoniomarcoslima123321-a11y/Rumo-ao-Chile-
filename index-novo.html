    h += '<section class="card"><h2>Prazos</h2>' +
      '<div class="row"><div class="l">Comprar as passagens até<small>' + (tr.ticketsDone ? 'valor das passagens já guardado' : (tr.ticketsOverdue ? 'prazo vencido · faltam ' + brl(tr.ticketsRem) : 'faltam ' + brl(tr.ticketsRem) + (tr.needTickets != null ? ' · ' + brl(tr.needTickets) + ' por mês' : ''))) + '</small></div><div class="v">' + R.fmtDate(s.ticketsDeadline) + '</div></div>' +
      '<div class="row"><div class="l">Juntar todo o dinheiro até<small>' + daysTxt(tr.daysToFinal) + '</small></div><div class="v">' + R.fmtDate(s.finalDeadline) + '</div></div></section>';

    var pt = '';
    if (tr.done) pt = 'Meta atingida. Parabéns!';
    else if (pj.month) {
      var late = pj.month > R.mk(s.finalDeadline);
      pt = (pj.basis === 'real' ? 'No seu ritmo real de ' + brl(pj.rate) + ' por mês' : 'Guardando a meta de ' + brl(pj.rate) + ' por mês') + ', o dinheiro fecha em ' + R.monthName(pj.month) + (late ? ' (depois do prazo final).' : '.');
    } else pt = pj.basis === 'real' ? 'No ritmo real de ' + brl(pj.rate) + ' por mês a meta não fecha.' : 'Com a meta mensal atual a meta da viagem não fecha.';
    h += '<section class="card"><h2>Previsão</h2><p style="margin:0">' + esc(pt) + '</p>' + (pj.basis === 'plan' && !tr.done ? '<p class="hint" style="margin:8px 0 0">Ainda não há meses completos de registro. Depois do primeiro mês, a previsão passa a usar quanto você realmente guardou.</p>' : '') + '</section>';

    h += '<section class="card"><h2>Dinheiro da meta</h2>' +
      '<div class="row"><div class="l">Guardado para a meta</div><div class="v">' + brl(tr.saved) + '</div></div>' +
      '<div class="row"><div class="l">Já gasto da meta<small>despesas na categoria “' + R.FUND_CAT + '”</small></div><div class="v">' + brl(tr.spent) + '</div></div>' +
      '<div class="row total"><div class="l">Ainda em mãos para a meta</div><div class="v' + neg(tr.inFund) + '">' + brl(tr.inFund) + '</div></div>' +
      '<p class="hint" style="margin:8px 0 0">Despesas dessa categoria saem do dinheiro guardado, não do salário do mês.</p></section>';

    h += '<div class="btn-row"><button class="btn primary" data-act="newSaving">' + svg('plus', 18) + 'Guardei dinheiro</button><button class="btn ghost" data-act="editGoalTotal">Editar valor da meta</button><button class="btn ghost" data-act="editGoal">Editar meta e prazos</button></div>';

    var dep = state.savings.filter(function (x) { return x.dest !== 'reserva'; }).sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    h += '<section class="card"><h2>Depósitos para a meta</h2>' + (dep.length ? '<div class="list">' + dep.map(function (x) {
      return '<button class="item" data-act="editMv" data-k="sv" data-id="' + esc(x.id) + '"><span class="body"><div class="t">' + esc(x.desc || 'Guardado para a meta') + '</div><div class="m">' + R.fmtDate(x.date) + '</div></span><span class="amt">' + brl(x.amount) + '</span></button>';
    }).join('') + '</div>' : '<div class="empty">Nenhum depósito ainda. Quando separar dinheiro para a meta, toque em “Guardei dinheiro”.</div>') + '</section>';
    return h;
  }

  /* ================= PLANO ================= */
  function niceCeil(v) {
    if (v <= 0) return 100;
    var p = Math.pow(10, Math.floor(Math.log10(v))), f = v / p;
    return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
  }
  function topRoundedBar(x, y, w, h, r) {
    if (h < 1) return '';
    r = Math.min(r, h, w / 2);
    return 'M' + x + ',' + (y + h) + 'L' + x + ',' + (y + r) + 'Q' + x + ',' + y + ' ' + (x + r) + ',' + y + 'L' + (x + w - r) + ',' + y + 'Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + r) + 'L' + (x + w) + ',' + (y + h) + 'Z';
  }
  function shortM(M) { return R.MS[Number(M.split('-')[1]) - 1]; }

  function barChart(rows, sel) {
    var W = 360, H = 210, pl = 46, pr = 6, pt = 10, pb = 26, iw = W - pl - pr, ih = H - pt - pb;
    var mx = niceCeil(Math.max.apply(null, rows.map(function (r) { return Math.max(r.planned, r.goal, r.saved); }).concat([1])));
    function y(v) { return pt + ih - (v / mx) * ih; }
    var gw = iw / rows.length, bw = Math.max(4, Math.floor((gw - 8) / 3) - 2), o = '';
    [0, mx / 2, mx].forEach(function (t) {
      o += '<line class="' + (t === 0 ? 'axis' : 'grid') + '" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(t) + '" y2="' + y(t) + '"/><text x="' + (pl - 6) + '" y="' + (y(t) + 4) + '" text-anchor="end" font-size="11">' + R.brlShort(t) + '</text>';
    });
    rows.forEach(function (r, i) {
      var gx = pl + i * gw, cx = gx + gw / 2, bx = cx - (3 * bw + 4) / 2, on = r.M === sel;
      if (on) o += '<rect x="' + (gx + 1) + '" y="' + pt + '" width="' + (gw - 2) + '" height="' + ih + '" rx="6" fill="var(--accent-soft)"/>';
      [[r.planned, 's1'], [r.goal, 's2'], [r.saved, 's3']].forEach(function (b, k) {
        var x = bx + k * (bw + 2), h = (b[0] / mx) * ih;
        o += '<path d="' + topRoundedBar(x, pt + ih - h, bw, h, 3) + '" fill="var(--' + b[1] + ')"/>';
      });
      o += '<text x="' + cx + '" y="' + (H - 8) + '" text-anchor="middle" font-size="11.5"' + (on ? ' style="font-weight:700;fill:var(--ink)"' : '') + '>' + shortM(r.M) + '</text>';
      o += '<rect class="hit" data-act="chartSel" data-m="' + r.M + '" x="' + gx + '" y="0" width="' + gw + '" height="' + H + '"/>';
    });
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Despesas previstas, meta de guardar e valor guardado em cada mês">' + o + '</svg>';
  }

  function lineChart(rows, goal, sel) {
    var W = 360, H = 210, pl = 46, pr = 14, pt = 22, pb = 26, iw = W - pl - pr, ih = H - pt - pb, n = rows.length;
    var all = [goal];
    rows.forEach(function (r) { all.push(r.cumPlan); if (r.cumAct != null) all.push(r.cumAct); if (r.cumFc != null) all.push(r.cumFc); });
    var mx = niceCeil(Math.max.apply(null, all));
    function x(i) { return n > 1 ? pl + i * (iw / (n - 1)) : pl + iw / 2; }
    function y(v) { return pt + ih - (v / mx) * ih; }
    function path(key) {
      var d = '', pen = false;
      rows.forEach(function (r, i) { if (r[key] == null) { pen = false; return; } d += (pen ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(r[key]).toFixed(1); pen = true; });
      return d;
    }
    var o = '';
    [0, mx / 2, mx].forEach(function (t) {
      o += '<line class="' + (t === 0 ? 'axis' : 'grid') + '" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(t) + '" y2="' + y(t) + '"/><text x="' + (pl - 6) + '" y="' + (y(t) + 4) + '" text-anchor="end" font-size="11">' + R.brlShort(t) + '</text>';
    });
    o += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(goal) + '" y2="' + y(goal) + '" stroke="var(--ink-2)" stroke-width="1.5" stroke-dasharray="2 4"/><text x="' + (W - pr) + '" y="' + (y(goal) - 6) + '" text-anchor="end" font-size="11.5" style="fill:var(--ink)">Meta ' + R.brlShort(goal) + '</text>';
    var si = -1; rows.forEach(function (r, i) { if (r.M === sel) si = i; });
    if (si >= 0) o += '<line x1="' + x(si) + '" x2="' + x(si) + '" y1="' + pt + '" y2="' + (pt + ih) + '" stroke="var(--accent)" stroke-width="1.5" opacity=".5"/>';
    o += '<path d="' + path('cumPlan') + '" fill="none" stroke="var(--s1)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
    o += '<path d="' + path('cumFc') + '" fill="none" stroke="var(--s3)" stroke-width="2.5" stroke-dasharray="6 5" stroke-linecap="round"/>';
    o += '<path d="' + path('cumAct') + '" fill="none" stroke="var(--s3)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
    rows.forEach(function (r, i) {
      if (r.cumAct != null) o += '<circle cx="' + x(i) + '" cy="' + y(r.cumAct) + '" r="4" fill="var(--s3)" stroke="var(--surface)" stroke-width="2"/>';
      if (r.M === sel) o += '<circle cx="' + x(i) + '" cy="' + y(r.cumPlan) + '" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>';
      o += '<text x="' + x(i) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="11.5"' + (r.M === sel ? ' style="font-weight:700;fill:var(--ink)"' : '') + '>' + shortM(r.M) + '</text>';
      var cw = n > 1 ? iw / (n - 1) : iw;
      o += '<rect class="hit" data-act="chartSel" data-m="' + r.M + '" x="' + (x(i) - cw / 2) + '" y="0" width="' + cw + '" height="' + H + '"/>';
    });
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Evolução do dinheiro guardado para a meta comparada com o planejado e com a meta total">' + o + '</svg>';
  }

  function monthStatus(st) {
    var diff = R.r2(st.savedTrip - st.goal);
    if (st.goal <= 0) return { k: 'neutral', t: 'Sem meta' };
    if (diff > 0.004) return { k: 'good', t: 'Acima da meta (+' + brl(diff) + ')' };
    if (diff >= -0.004) return { k: 'good', t: 'Meta cumprida' };
    if (!st.feasible) return { k: 'bad', t: 'Meta maior que o disponível' };
    if (st.rel === 'past') return { k: 'bad', t: 'Abaixo da meta (−' + brl(-diff) + ')' };
    if (st.rel === 'current') return { k: 'warn', t: 'Faltam ' + brl(-diff) };
    return { k: 'info', t: 'Planejado' };
  }

  function viewPlan() {
    var td = today(), s = state.settings, months = R.planMonths(state), rows = R.chartSeries(state, td);
    var sel = ui.chartSel && months.indexOf(ui.chartSel) >= 0 ? ui.chartSel : (months.indexOf(ui.month) >= 0 ? ui.month : months[0]);
    var r = rows.filter(function (x) { return x.M === sel; })[0] || rows[0];
    var goal = R.r2(Number(s.ticketsGoal) + Number(s.spendGoal));
    function swatch(c) { return '<span><i style="background:var(--' + c + ')"></i>'; }

    var h = '<section class="card"><h2>Despesas e economia por mês</h2>' + barChart(rows, sel) +
      '<div class="chart-legend">' + swatch('s1') + 'Despesas previstas</span>' + swatch('s2') + 'Meta de guardar</span>' + swatch('s3') + 'Guardei</span></div>' +
      '<div class="chart-read"><b>' + esc(R.monthName(r.M)) + '</b>Despesas ' + brl(r.planned) + ' · meta de guardar ' + brl(r.goal) + ' · guardei ' + brl(r.saved) + '</div></section>';

    h += '<section class="card"><h2>Evolução da meta</h2>' + lineChart(rows, goal, sel) +
      '<div class="chart-legend">' + swatch('s1') + 'Planejado</span>' + swatch('s3') + 'Guardado de verdade</span><span><i style="background:none;border-top:2px dashed var(--s3);border-radius:0;height:0;width:14px"></i>Previsão</span></div>' +
      '<div class="chart-read"><b>' + esc(R.monthName(r.M)) + '</b>Planejado até aqui ' + brl(r.cumPlan) + ' · ' + (r.cumAct != null ? 'guardado ' + brl(r.cumAct) : 'ainda sem registro neste mês') + (r.cumFc != null && r.cumAct == null ? ' · previsão ' + brl(r.cumFc) : '') + '</div></section>';

    h += '<p class="sub" style="margin:2px 4px 0">Toque em um mês para ajustar o salário e a meta daquele mês.</p>';
    R.planMonthsFor(state, ui.planExtra).forEach(function (M) {
      var st = R.monthStats(state, M, td), ms = monthStatus(st);
      h += '<button class="card mcard' + (M === ui.month ? ' sel' : '') + '" data-act="monthAdj" data-m="' + M + '"><div class="hd"><h3>' + esc(R.monthName(M).replace(/^./, function (c) { return c.toUpperCase(); })) + '</h3>' + pill(ms.k, ms.t) + '</div>' +
        '<dl class="mgrid" style="margin-bottom:0">' +
        '<div><dt>Salário previsto' + (st.plannedSalary !== Number(s.salary) ? ' (ajustado)' : '') + '</dt><dd>' + brl(st.plannedSalary) + '</dd></div>' +
        '<div><dt>Despesas previstas</dt><dd>' + brl(st.planned) + '</dd></div>' +
        '<div><dt>Despesas pagas</dt><dd>' + brl(st.paid) + '</dd></div>' +
        '<div><dt>Pretendo guardar' + (R.planFor(state, M).customGoal ? ' (ajustado)' : '') + '</dt><dd>' + brl(st.goal) + '</dd></div>' +
        '<div><dt>Realmente guardei</dt><dd>' + brl(st.savedTrip) + '</dd></div>' +
        '<div><dt>Saldo restante</dt><dd class="' + neg(st.free).trim() + '">' + brl(st.free) + '</dd></div></dl></button>';
    });
    h += '<button class="btn block" data-act="planMore">' + svg('plus', 18) + 'Adicionar mais 12 meses</button>';
    return h;
  }

  /* ================= ASSISTENTE FINANCEIRO ================= */
  var SUGGEST = ['Quanto falta para minha meta?', 'Qual porcentagem da meta já alcancei?', 'Se eu guardar R$ 250 por mês, em quanto tempo atinjo a meta?', 'Quanto terei guardado daqui a 6 meses?', 'Quanto preciso guardar por mês para fechar no prazo?'];
  function fmtMsg(t) { return esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>'); }
  function viewIA() {
    var h = '<section class="card"><h2>Assistente Financeiro</h2><p class="sub" style="margin:0">Pergunte sobre sua meta e faça simulações. As respostas usam os números do seu app e contas com os valores que você escrever. Funciona no próprio aparelho, sem internet e sem custo.</p></section>';
    if (!ui.chat.length) {
      h += '<section class="card"><h2>Experimente perguntar</h2><div class="chips">' + SUGGEST.map(function (q) { return '<button class="chip" data-act="askChip" data-q="' + esc(q) + '">' + esc(q) + '</button>'; }).join('') + '</div></section>';
    } else {
      h += '<div class="chat" id="chatList">' + ui.chat.map(function (m) { return '<div class="msg ' + m.r + '">' + fmtMsg(m.t) + '</div>'; }).join('') + '</div>' +
        '<button class="link" data-act="askClear" style="align-self:flex-start">Limpar conversa</button>';
    }
    h += '<div class="composer"><input class="inp" id="askInput" type="text" enterkeyhint="send" autocomplete="off" placeholder="Digite sua pergunta" aria-label="Pergunta ao assistente" value="' + esc(ui.draft) + '"><button class="btn primary" data-act="askSend">Enviar</button></div>';
    return h;
  }
  function sendAsk(text) {
    var q = String(text == null ? '' : text).trim();
    if (!q) { toast('Digite uma pergunta'); return; }
    var a;
    try { a = R.ask(state, q, today()); } catch (e) { a = 'Não consegui calcular isso agora. Tente reescrever a pergunta com os valores, por exemplo: "se eu guardar R$ 250 por mês, em quanto tempo atinjo a meta?".'; }
    ui.chat.push({ r: 'u', t: q }); ui.chat.push({ r: 'a', t: a }); ui.draft = '';
    renderView();
    var el = $('#askInput'); if (el) el.focus();
    window.scrollTo(0, document.body.scrollHeight);
  }

  /* ================= PASSO A PASSO ================= */
  var TOURKEY = 'rumo-ao-chile:tour';
  var TOUR = [
    { title: 'Bem-vindo!', text: 'Este é o Rumo aos Meus Sonhos. Em poucos passos você define sua meta, registra o que guarda e acompanha o caminho. Vamos?' },
    { tab: 'chile', sel: '[data-act="editGoal"]', title: '1. Defina sua meta', text: 'Toque aqui para dar um nome à sua meta (viagem, carro, casa…), escolher a imagem, o valor e os prazos.' },
    { tab: 'home', sel: '[data-act="newIncome"]', title: '2. Registre o salário', text: 'Quando o salário cair, toque em “Recebi”. Ele entra no caixa do mês.' },
    { tab: 'home', sel: '[data-act="newSaving"]', title: '3. Registre o que guardou', text: 'Toque em “Guardei” sempre que separar dinheiro para a meta. É isso que faz a barra de progresso andar.' },
    { tab: 'home', sel: '#fab', title: '4. Registre despesas', text: 'O botão + anota uma despesa. Contas que se repetem todo mês podem ser cadastradas na aba Mais.' },
    { tab: 'plan', sel: '#nav [data-tab="plan"]', title: '5. Veja o plano mês a mês', text: 'Na aba Plano você ajusta salário e meta de cada mês e pode avançar quantos meses quiser.' },
    { tab: 'ia', sel: '#askInput', title: '6. Pergunte ao Assistente', text: 'Escreva perguntas como “se eu guardar R$ 250 por mês, em quanto tempo chego lá?”. Ele calcula com os seus dados.' },
    { tab: 'more', sel: '#rtUrl, [data-act="rtInvite"]', title: '7. Use em mais de um aparelho', text: 'Aqui você liga a sincronização (opcional) e faz o backup dos seus dados.' },
    { title: 'Tudo pronto!', text: 'Vamos começar definindo a sua meta. Para rever este passo a passo, abra Mais > Ver passo a passo.' }
  ];
  var tour = null;
  function tourEl() { return document.getElementById('tour'); }
  function tourSeen() { try { return localStorage.getItem(TOURKEY) === '1'; } catch (e) { return false; } }
  function tourEnd() {
    var t = tourEl(); if (t) t.remove();
    tour = null;
    try { localStorage.setItem(TOURKEY, '1'); } catch (e) { /* ok */ }
  }
  function tourStart() { tour = { i: 0 }; tourShow(); }
  function tourShow() {
    var s = TOUR[tour.i], last = tour.i === TOUR.length - 1;
    if (ui.sheet) closeSheet();
    if (s.tab && ui.tab !== s.tab) { ui.tab = s.tab; renderAll(); window.scrollTo(0, 0); }
    var t = tourEl();
    if (!t) { t = document.createElement('div'); t.id = 'tour'; document.body.appendChild(t); }
    t.innerHTML = '<div class="tb"></div><div class="th" hidden></div><div class="tc" role="dialog" aria-modal="true" aria-label="Passo a passo">' +
      '<span class="dots">Passo ' + (tour.i + 1) + ' de ' + TOUR.length + '</span><h3>' + esc(s.title) + '</h3><p>' + esc(s.text) + '</p>' +
      '<div class="btn-row">' + (tour.i > 0 ? '<button class="btn ghost sm" data-act="tourPrev">Voltar</button>' : '<button class="btn ghost sm" data-act="tourSkip">Pular</button>') +
      '<button class="btn primary sm" data-act="tourNext">' + (last ? 'Definir minha meta' : 'Próximo') + '</button></div>' +
      (tour.i > 0 && !last ? '<button class="link" data-act="tourSkip" style="align-self:flex-start;padding:0">Pular tutorial</button>' : '') + '</div>';
    tourPlace();
  }
  function tourPlace() {
    var t = tourEl(); if (!tour || !t) return;
    var s = TOUR[tour.i], el = s.sel ? document.querySelector(s.sel) : null;
    var hole = t.querySelector('.th'), card = t.querySelector('.tc'), tb = t.querySelector('.tb');
    if (!el) { hole.hidden = true; tb.style.background = 'rgba(5,12,22,.62)'; card.style.top = Math.max(16, (window.innerHeight - card.offsetHeight) / 2) + 'px'; return; }
    tb.style.background = 'transparent';
    try { el.scrollIntoView({ block: 'center' }); } catch (e) { /* ok */ }
    var r = el.getBoundingClientRect(), pd = 6;
    hole.hidden = false;
    hole.style.left = (r.left - pd) + 'px'; hole.style.top = (r.top - pd) + 'px';
    hole.style.width = (r.width + pd * 2) + 'px'; hole.style.height = (r.height + pd * 2) + 'px';
    var ch = card.offsetHeight, below = r.bottom + pd + 14;
    card.style.top = (below + ch <= window.innerHeight - 8 ? below : Math.max(8, r.top - pd - 14 - ch)) + 'px';
  }

  /* ================= MAIS ================= */
  function numField(label, key, val, hint) {
    return '<div class="field"><label for="s_' + key + '">' + label + '</label><input class="inp" id="s_' + key + '" inputmode="decimal" autocomplete="off" data-set="' + key + '" value="' + esc(val) + '">' + (hint ? '<span class="hint">' + hint + '</span>' : '') + '</div>';
  }
  function sw(on, act, attrs, label) {
    return '<div class="sw-row"><span>' + label + '</span><button class="switch" role="switch" aria-checked="' + on + '" aria-label="' + esc(label) + '" data-act="' + act + '" ' + attrs + '></button></div>';
  }
  function viewMore() {
    var s = state.settings, tp = state.recurring.filter(function (r) { return r.kind === 'transport'; })[0];
    var h = '<section class="card"><h2>Salário e meta</h2><div class="grid2">' +
      numField('Salário mensal (R$)', 'salary', R.toInput(s.salary)) + numField('Guardar por mês (R$)', 'monthlyGoal', R.toInput(s.monthlyGoal)) +
      '</div><p class="hint" style="margin:10px 0 0">Para mudar só um mês, use a aba Plano.</p></section>';

    h += '<section class="card"><h2>Transporte para o trabalho</h2><div class="grid2">' +
      numField('Passagem (R$)', 'fare', R.toInput(s.fare)) + numField('Uber (R$)', 'uber', R.toInput(s.uber)) +
      numField('Dias por semana', 'days', String(s.days)) + numField('Semanas por mês', 'weeks', String(s.weeks).replace('.', ',')) + '</div>' +
      '<div class="row total" style="margin-top:12px"><div class="l">' + brl(R.transportDaily(s)) + ' por dia × ' + s.days + ' dias × ' + String(s.weeks).replace('.', ',') + ' semanas</div><div class="v">' + brl(R.transportMonthly(s)) + '</div></div>' +
      (tp ? sw(tp.active, 'toggleRec', 'data-id="' + tp.id + '" data-k="active"', 'Contar no orçamento') + sw(tp.confirmed, 'toggleRec', 'data-id="' + tp.id + '" data-k="confirmed"', 'Valor confirmado (desligue se for estimativa)') : '') + '</section>';

    var recs = state.recurring.filter(function (r) { return r.kind !== 'transport'; });
    h += '<section class="card"><h2>Despesas que se repetem todo mês</h2>' + (recs.length ? recs.map(function (r) {
      return '<div class="rec"><div class="rt"><b>' + esc(r.name) + '</b><button class="btn sm danger" data-act="delRec" data-id="' + r.id + '" aria-label="Excluir ' + esc(r.name) + '">Excluir</button></div>' +
        '<div class="field"><label for="a_' + r.id + '">Valor por mês (R$)</label><input class="inp" id="a_' + r.id + '" inputmode="decimal" autocomplete="off" data-set="rec:' + r.id + ':amount" value="' + R.toInput(r.amount) + '"></div>' +
        sw(r.active, 'toggleRec', 'data-id="' + r.id + '" data-k="active"', 'Contar no orçamento') + sw(r.confirmed, 'toggleRec', 'data-id="' + r.id + '" data-k="confirmed"', 'Valor confirmado (desligue se for estimativa)') + '</div>';
    }).join('') : '<div class="empty">Nenhuma despesa fixa cadastrada.</div>') +
      '<button class="btn block" style="margin-top:8px" data-act="newFixed">' + svg('plus', 18) + 'Nova despesa fixa</button></section>';

    var used = {}; state.expenses.forEach(function (e) { used[e.cat] = true; }); state.recurring.forEach(function (r) { used[r.cat] = true; });
    h += '<section class="card"><h2>Categorias</h2><div class="chips">' + state.cats.map(function (c) {
      var custom = R.DEFAULT_CATS.indexOf(c) < 0;
      return '<span class="chip" style="display:inline-flex;align-items:center;gap:6px">' + esc(c) + (custom && !used[c] ? '<button data-act="delCat" data-c="' + esc(c) + '" aria-label="Excluir categoria ' + esc(c) + '" style="display:grid;place-items:center">' + svg('x', 14) + '</button>' : '') + '</span>';
    }).join('') + '</div><div style="display:flex;gap:10px;margin-top:12px"><input class="inp" id="newCat" placeholder="Nova categoria" maxlength="30" autocomplete="off"><button class="btn" data-act="addCat">Adicionar</button></div></section>';

    h += '<section class="card"><h2>Tutorial</h2><button class="btn block" data-act="tourStart">Ver passo a passo</button></section>';
    h += rtCard();
    h += '<section class="card"><h2>Seus dados</h2>' + syncLine() +
      '<p class="hint" style="margin:10px 0 12px">Tudo o que você registra é salvo na hora. Quando o app abre dentro da sua conta, os dados ficam guardados nela e também neste aparelho. Sem a conta, ficam só neste aparelho e podem sumir se você limpar os dados do navegador, então faça um backup de vez em quando.</p>' +
      '<div class="btn-row"><button class="btn" data-act="backup">Backup e restauração</button><button class="btn danger" data-act="reset">Apagar tudo</button></div></section>';
    return h;
  }

  /* ================= painéis inferiores ================= */
  function openSheet(kind, data) { ui.sheet = { kind: kind, data: data || {} }; renderSheet(); }
  function closeSheet() { ui.sheet = null; $('#sheet').hidden = true; $('#scrim').hidden = true; $('#sheet').innerHTML = ''; }
  function collect() {
    if (!ui.sheet) return;
    document.querySelectorAll('#sheet [data-f]').forEach(function (el) { ui.sheet.data[el.dataset.f] = el.value; });
  }
  function shHead(t) { return '<div class="grab"></div><div class="hd"><h3>' + esc(t) + '</h3><button class="x" data-act="close" aria-label="Fechar">' + svg('x', 20) + '</button></div>'; }
  function inp(f, label, val, o) {
    o = o || {};
    return '<div class="field"><label for="f_' + f + '">' + label + '</label><input class="inp' + (o.cls ? ' ' + o.cls : '') + '" id="f_' + f + '" data-f="' + f + '" ' + (o.type ? 'type="' + o.type + '"' : 'inputmode="' + (o.mode || 'text') + '"') + ' autocomplete="off" value="' + esc(val == null ? '' : val) + '"' + (o.ph ? ' placeholder="' + esc(o.ph) + '"' : '') + '>' + (o.hint ? '<span class="hint">' + o.hint + '</span>' : '') + '</div>';
  }
  function segBtns(k, cur, opts) {
    return '<div class="seg" role="group">' + opts.map(function (o) { return '<button data-act="set" data-k="' + k + '" data-v="' + o[0] + '" aria-pressed="' + (cur === o[0]) + '">' + o[1] + '</button>'; }).join('') + '</div>';
  }
  function delBlock(d, label) {
    if (!d.id) return '';
    return '<button class="btn danger block" data-act="' + (d.confirmDel ? 'delDo' : 'delAsk') + '">' + (d.confirmDel ? 'Toque de novo para confirmar' : label) + '</button>';
  }

  function renderSheet() {
    var sh = ui.sheet; if (!sh) return;
    var d = sh.data, h = '';
    if (sh.kind === 'expense') {
      var title = d.id ? 'Editar despesa' : (d.recId ? 'Despesa prevista' : 'Nova despesa');
      h = shHead(title) +
        inp('amount', 'Valor (R$)', d.amount, { cls: 'money', mode: 'decimal', ph: '0,00' }) +
        inp('name', 'Nome (opcional)', d.name, { ph: 'Ex.: Lanche, Uber, mensalidade' }) +
        '<div class="field"><span class="lbl">Categoria</span><div class="chips">' + state.cats.map(function (c) { return '<button class="chip" data-act="set" data-k="cat" data-v="' + esc(c) + '" aria-pressed="' + (d.cat === c) + '">' + esc(c) + '</button>'; }).join('') + '</div>' +
        (d.cat === R.FUND_CAT ? '<span class="hint">Sai do dinheiro guardado para a meta, não do salário do mês.</span>' : '') + '</div>' +
        '<div class="grid2">' + inp('date', 'Data', d.date, { type: 'date' }) + '<div class="field"><span class="lbl">Situação</span>' + segBtns('status', d.status, [['paga', 'Paga'], ['pendente', 'Pendente']]) + '</div></div>' +
        '<details' + (d.moreOpen ? ' open' : '') + '><summary>Mais opções</summary><div class="stack"><div class="field"><span class="lbl">Tipo</span>' + segBtns('type', d.type, [['variavel', 'Variável'], ['fixa', 'Fixa']]) + '</div>' +
        sw(!!d.estimate, 'flip', 'data-k="estimate"', 'Valor ainda é uma estimativa') +
        (!d.id && !d.recId && d.type === 'fixa' ? sw(!!d.repeat, 'flip', 'data-k="repeat"', 'Repetir todos os meses') : '') +
        inp('note', 'Observação (opcional)', d.note, {}) + '</div></details>' +
        (d.recId && !d.id ? '<p class="hint" style="margin:0">Ao salvar, este valor passa a valer só para este mês.</p>' : '') +
        '<div class="err" id="sheetErr" role="alert"></div><button class="btn primary block" data-act="saveExpense">Salvar</button>' + delBlock(d, d.recId ? 'Voltar ao valor previsto' : 'Excluir despesa');
    } else if (sh.kind === 'income') {
      var ps = R.planFor(state, R.mk(d.date || today())).salary;
      h = shHead(d.id ? 'Editar recebimento' : 'Recebi dinheiro') +
        inp('amount', 'Valor (R$)', d.amount, { cls: 'money', mode: 'decimal', ph: '0,00' }) +
        (ps > 0 && !d.id ? '<div class="chips"><button class="chip" data-act="fillAmount" data-v="' + R.toInput(ps) + '">Salário previsto ' + brl(ps) + '</button></div>' : '') +
        inp('desc', 'De onde veio', d.desc, { ph: 'Salário' }) + inp('date', 'Data', d.date, { type: 'date' }) +
        '<div class="err" id="sheetErr" role="alert"></div><button class="btn primary block" data-act="saveIncome">Salvar</button>' + delBlock(d, 'Excluir recebimento');
    } else if (sh.kind === 'saving') {
      var gm = R.planFor(state, R.mk(d.date || today())).goal;
      h = shHead(d.id ? 'Editar economia' : 'Guardei dinheiro') +
        inp('amount', 'Valor (R$)', d.amount, { cls: 'money', mode: 'decimal', ph: '0,00' }) +
        (gm > 0 && !d.id ? '<div class="chips"><button class="chip" data-act="fillAmount" data-v="' + R.toInput(gm) + '">Meta do mês ' + brl(gm) + '</button></div>' : '') +
        '<div class="field"><span class="lbl">Para onde foi</span>' + segBtns('dest', d.dest, [['viagem', gname()], ['reserva', 'Reserva geral']]) + '</div>' +
        inp('date', 'Data', d.date, { type: 'date' }) + inp('desc', 'Observação (opcional)', d.desc, {}) +
        '<p class="hint" style="margin:0">Guardar dinheiro não conta como despesa: ele sai do saldo disponível, mas não entra no total de gastos.</p>' +
        '<div class="err" id="sheetErr" role="alert"></div><button class="btn primary block" data-act="saveSaving">Salvar</button>' + delBlock(d, 'Excluir economia');
    } else if (sh.kind === 'goal') {
      h = shHead('Meta e prazos') +
        inp('goalName', 'Nome da meta', d.goalName, { ph: 'Ex.: Meu carro, Casa própria' }) +
        '<div class="field"><span class="lbl">Tipo da meta (define a imagem)</span><div class="chips">' + [['viagem', 'Viagem'], ['carro', 'Carro'], ['casa', 'Casa'], ['estudos', 'Estudos'], ['outro', 'Outro']].map(function (g) { return '<button class="chip" data-act="set" data-k="goalType" data-v="' + g[0] + '" aria-pressed="' + (d.goalType === g[0]) + '">' + g[1] + '</button>'; }).join('') + '</div></div>' +
        '<div class="grid2">' + inp('ticketsGoal', 'Passagens (R$)', d.ticketsGoal, { mode: 'decimal' }) + inp('spendGoal', 'Gastos na viagem (R$)', d.spendGoal, { mode: 'decimal' }) + '</div>' +
        '<div class="grid2">' + inp('ticketsDeadline', 'Comprar passagens até', d.ticketsDeadline, { type: 'date' }) + inp('finalDeadline', 'Juntar tudo até', d.finalDeadline, { type: 'date' }) + '</div>' +
        '<div class="grid2">' + inp('monthlyGoal', 'Guardar por mês (R$)', d.monthlyGoal, { mode: 'decimal' }) + inp('startMonth', 'Início do plano', d.startMonth, { type: 'month' }) + '</div>' +
        '<p class="hint" style="margin:0">O mês do prazo conta como mês de economia. Tudo é recalculado ao salvar.</p>' +
        '<div class="err" id="sheetErr" role="alert"></div><button class="btn primary block" data-act="saveGoal">Salvar</button>';
    } else if (sh.kind === 'goaltotal') {
      var gt = R.tripStats(state, today());
      h = shHead('Editar valor da meta') +
        '<div class="row total" style="margin:0"><div class="l">Meta atual<small>já guardado: ' + brl(gt.saved) + ' (não muda)</small></div><div class="v">' + brl(gt.goal) + '</div></div>' +
        inp('total', 'Novo valor da meta (R$)', d.total, { cls: 'money', mode: 'decimal', ph: '0,00', hint: 'A diferença entra em “Gastos na viagem”. Se o novo valor for menor que as passagens (' + brl(state.settings.ticketsGoal) + '), as passagens também são ajustadas. O dinheiro já guardado não é alterado.' }) +
        '<div class="err" id="sheetErr" role="alert"></div><div class="btn-row"><button class="btn ghost" data-act="close">Cancelar</button><button class="btn primary" data-act="saveGoalTotal">Confirmar</button></div>';
    } else if (sh.kind === 'monthadj') {
      var pl = R.planFor(state, d.M);
      h = shHead('Ajustar ' + R.monthName(d.M)) +
        inp('salary', 'Salário previsto (R$)', d.salary, { mode: 'decimal', ph: R.toInput(state.settings.salary), hint: 'Em branco usa o valor padrão (' + brl(state.settings.salary) + ').' }) +
        inp('goal', 'Quanto pretendo guardar (R$)', d.goal, { mode: 'decimal', ph: R.toInput(state.settings.monthlyGoal), hint: 'Em branco usa o valor padrão (' + brl(state.settings.monthlyGoal) + ').' }) +
        '<div class="err" id="sheetErr" role="alert"></div><button class="btn primary block" data-act="saveMonthAdj">Salvar</button>' +
        '<button class="btn block" data-act="gotoMonth" data-m="' + d.M + '">Ver despesas deste mês</button>';
    } else if (sh.kind === 'months') {
      var firstM = R.monthList(state)[0], yr = ui.pickYear, mchips = '';
      for (var mi = 1; mi <= 12; mi++) {
        var MM = yr + '-' + ('0' + mi).slice(-2);
        mchips += '<button class="chip" data-act="gotoMonth" data-m="' + MM + '" aria-pressed="' + (MM === ui.month) + '"' + (MM < firstM ? ' disabled' : '') + '>' + R.MS[mi - 1].charAt(0).toUpperCase() + R.MS[mi - 1].slice(1) + '</button>';
      }
      h = shHead('Escolher mês') +
        '<div class="stepper" style="align-self:center"><button data-act="pickYear" data-d="-1" aria-label="Ano anterior"' + (yr <= Number(firstM.slice(0, 4)) ? ' disabled' : '') + '>' + svg('left', 20) + '</button><span class="mlabel" style="padding:0 10px;font-weight:600">' + yr + '</span><button data-act="pickYear" data-d="1" aria-label="Próximo ano">' + svg('right', 20) + '</button></div>' +
        '<div class="chips" style="justify-content:center">' + mchips + '</div>';
    } else if (sh.kind === 'backup') {
      h = shHead('Backup e restauração') +
        '<p class="sub" style="margin:0">Este texto é uma cópia de todos os seus dados. Guarde em um lugar seguro (por exemplo, nas suas notas). Para restaurar, cole o texto aqui e toque em Restaurar.</p>' +
        '<textarea class="inp" id="f_backup" data-f="backup" spellcheck="false" aria-label="Texto do backup">' + esc(d.backup) + '</textarea>' +
        '<div class="err" id="sheetErr" role="alert"></div><div class="btn-row"><button class="btn primary" data-act="copyBackup">Copiar</button><button class="btn ' + (d.confirmRestore ? 'danger' : 'ghost') + '" data-act="restore">' + (d.confirmRestore ? 'Toque de novo para substituir' : 'Restaurar do texto') + '</button></div>';
    } else if (sh.kind === 'invite') {
      h = shHead('Link de convite') +
        '<p class="sub" style="margin:0">Abra este link em outro aparelho (no Chrome) para ver e editar os mesmos dados. Quem tiver o link acessa tudo, então envie só para quem você confia.</p>' +
        '<input class="inp" id="f_invite" readonly value="' + esc(rt ? rtLink() : '') + '" aria-label="Link de convite">' +
        '<div class="err" id="sheetErr" role="alert"></div><div class="btn-row"><button class="btn primary" data-act="copyInvite">Copiar link</button><button class="btn ghost" data-act="close">Fechar</button></div>';
    } else if (sh.kind === 'reset') {
      h = shHead('Apagar todos os dados?') +
        '<p style="margin:0">Isso apaga despesas, recebimentos, economias e ajustes, e volta os valores iniciais. Não dá para desfazer. Se quiser guardar uma cópia, faça o backup antes.</p>' +
        (rt ? '<p class="err" style="margin:0">Atenção: a sincronização está ligada. Apagar aqui também apaga os dados de todos os outros aparelhos.</p>' : '') +
        '<div class="btn-row"><button class="btn ghost" data-act="close">Cancelar</button><button class="btn danger" data-act="resetDo">Apagar tudo</button></div>';
    }
    var el = $('#sheet');
    el.innerHTML = '<div class="sh gut">' + h + '</div>';
    el.hidden = false; $('#scrim').hidden = false;
    if (d.focus) { var f = el.querySelector('[data-f="' + d.focus + '"]'); d.focus = null; if (f) setTimeout(function () { f.focus(); }, 60); }
  }
  function sheetErr(msg) { var e = $('#sheetErr'); if (e) e.textContent = msg; }

  function expenseDraft(o) {
    return Object.assign({ id: null, recId: null, amount: '', name: '', cat: 'Outros', date: defaultDateIn(ui.month), status: 'paga', type: 'variavel', estimate: false, repeat: false, note: '', focus: 'amount' }, o || {});
  }

  /* ================= salvar ================= */
  function afterSave(date, msg) {
    var M = R.mk(date);
    closeSheet(); fixMonth(); if (M >= R.monthList(state)[0]) ui.month = M;
    renderAll(); toast(msg);
  }
  function saveExpense() {
    collect(); var d = ui.sheet.data, amount = R.parseBR(d.amount);
    if (isNaN(amount) || amount < 0 || (amount === 0 && !d.recId)) return sheetErr('Digite um valor maior que zero.');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d.date || '')) return sheetErr('Escolha a data.');
    var name = (d.name || '').trim() || d.cat;
    var e = { id: d.id || R.uid(), name: name, amount: R.r2(amount), cat: d.cat, date: d.date, type: d.type, status: d.status, confirmed: !d.estimate, note: (d.note || '').trim() };
    if (d.recId) e.recId = d.recId;
    if (d.repeat && !d.id && !d.recId) {
      var r = { id: R.uid(), name: name, cat: d.cat, kind: 'fixed', amount: e.amount, active: true, confirmed: e.confirmed };
      state.recurring.push(r);
      if (e.status === 'paga' || R.mk(e.date) < state.settings.startMonth) { e.recId = r.id; R.upsert(state.expenses, e); }
    } else R.upsert(state.expenses, e);
    save(); afterSave(e.date, 'Despesa salva em ' + R.monthLbl(R.mk(e.date)));
  }
  function saveIncome() {
    collect(); var d = ui.sheet.data, a = R.parseBR(d.amount);
    if (!(a > 0)) return sheetErr('Digite um valor maior que zero.');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d.date || '')) return sheetErr('Escolha a data.');
    R.upsert(state.incomes, { id: d.id || R.uid(), date: d.date, amount: R.r2(a), desc: (d.desc || '').trim() || 'Salário' });
    save(); afterSave(d.date, 'Recebimento salvo');
  }
  function saveSaving() {
    collect(); var d = ui.sheet.data, a = R.parseBR(d.amount);
    if (!(a > 0)) return sheetErr('Digite um valor maior que zero.');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d.date || '')) return sheetErr('Escolha a data.');
    R.upsert(state.savings, { id: d.id || R.uid(), date: d.date, amount: R.r2(a), dest: d.dest, desc: (d.desc || '').trim() });
    save(); afterSave(d.date, d.dest === 'reserva' ? 'Guardado na reserva' : 'Guardado para a meta');
  }
  function saveGoal() {
    collect(); var d = ui.sheet.data;
    var t = R.parseBR(d.ticketsGoal), sp = R.parseBR(d.spendGoal), mg = R.parseBR(d.monthlyGoal);
    if ([t, sp, mg].some(function (x) { return isNaN(x) || x < 0; })) return sheetErr('Confira os valores: use números iguais ou maiores que zero.');
    if (!d.ticketsDeadline || !d.finalDeadline || !/^\d{4}-\d{2}$/.test(d.startMonth || '')) return sheetErr('Preencha as datas e o início do plano.');
    if (d.ticketsDeadline > d.finalDeadline) return sheetErr('O prazo das passagens não pode ser depois do prazo final.');
    var s = state.settings;
    var gn = String(d.goalName || '').trim();
    if (!gn) return sheetErr('Dê um nome para a meta.');
    s.goalName = gn.slice(0, 40);
    s.goalType = GICON[d.goalType] ? d.goalType : 'outro';
    s.ticketsGoal = R.r2(t); s.spendGoal = R.r2(sp); s.monthlyGoal = R.r2(mg);
    s.ticketsDeadline = d.ticketsDeadline; s.finalDeadline = d.finalDeadline; s.startMonth = d.startMonth;
    save(); closeSheet(); fixMonth(); ui.chartSel = null; renderAll(); toast('Meta atualizada e valores recalculados');
  }
  function saveGoalTotal() {
    collect(); var d = ui.sheet.data, v = R.parseBR(d.total);
    if (isNaN(v) || v <= 0) return sheetErr('Digite um valor maior que zero.');
    var s = state.settings, t = Number(s.ticketsGoal);
    v = R.r2(v);
    if (v >= t) s.spendGoal = R.r2(v - t); else { s.ticketsGoal = v; s.spendGoal = 0; }
    save(); closeSheet(); renderAll(); toast('Meta atualizada para ' + brl(v));
  }
  function saveMonthAdj() {
    collect(); var d = ui.sheet.data, p = {};
    var sv = String(d.salary || '').trim(), gv = String(d.goal || '').trim();
    if (sv) { var a = R.parseBR(sv); if (isNaN(a) || a < 0) return sheetErr('Salário inválido.'); p.salary = R.r2(a); }
    if (gv) { var b = R.parseBR(gv); if (isNaN(b) || b < 0) return sheetErr('Meta inválida.'); p.goal = R.r2(b); }
    if (p.salary == null && p.goal == null) delete state.plan[d.M]; else state.plan[d.M] = p;
    save(); closeSheet(); renderAll(); toast('Mês ajustado');
  }

  /* ================= eventos ================= */
  function findItem(id) { return R.monthItems(state, ui.month).filter(function (i) { return i.id === id; })[0]; }

  function act(a, b) {
    var d = ui.sheet ? ui.sheet.data : null, id = b.dataset.id;
    switch (a) {
      case 'tab': ui.tab = b.dataset.tab; renderAll(); window.scrollTo(0, 0); break;
      case 'goChile': ui.tab = 'chile'; renderAll(); window.scrollTo(0, 0); break;
      case 'prevM': case 'nextM': {
        var first = R.monthList(state)[0], nm = R.addMonths(ui.month, a === 'nextM' ? 1 : -1);
        if (nm >= first) { ui.month = nm; renderAll(); } break;
      }
      case 'pickM': ui.pickYear = Number(ui.month.slice(0, 4)); openSheet('months'); break;
      case 'pickYear': ui.pickYear += Number(b.dataset.d); renderSheet(); break;
      case 'planMore': ui.planExtra += 12; renderAll(); break;
      case 'gotoMonth': ui.month = b.dataset.m; ui.tab = (ui.sheet && ui.sheet.kind === 'monthadj') ? 'desp' : ui.tab; closeSheet(); renderAll(); window.scrollTo(0, 0); break;
      case 'alertsAll': ui.alertsAll = !ui.alertsAll; renderAll(); break;
      case 'filter': ui.filter = b.dataset.v; renderAll(); break;
      case 'chartSel': ui.chartSel = b.dataset.m; renderAll(); break;
      case 'close': closeSheet(); break;
      case 'newExpense': openSheet('expense', expenseDraft()); break;
      case 'newFixed': openSheet('expense', expenseDraft({ type: 'fixa', repeat: true, status: 'pendente', moreOpen: true })); break;
      case 'newIncome': openSheet('income', { amount: '', desc: 'Salário', date: defaultDateIn(ui.month), focus: 'amount' }); break;
      case 'newSaving': openSheet('saving', { amount: '', dest: 'viagem', desc: '', date: defaultDateIn(ui.month), focus: 'amount' }); break;
      case 'editItem': {
        var it = findItem(id); if (!it) break;
        openSheet('expense', expenseDraft({ id: it.virtual ? null : it.id, recId: it.recId || null, amount: R.toInput(it.amount), name: it.name, cat: it.cat, date: it.virtual ? defaultDateIn(ui.month) : it.date, status: it.virtual ? 'pendente' : it.status, type: it.type, estimate: !it.confirmed, note: it.note || '', focus: null, moreOpen: !it.confirmed }));
        break;
      }
      case 'togglePay': {
        var item = findItem(id); if (!item) break;
        var wasPaid = item.status === 'paga';
        R.togglePaid(state, item, defaultDateIn(ui.month)); save(); renderAll(); toast(wasPaid ? 'Marcada como pendente' : 'Marcada como paga'); break;
      }
      case 'editMv': {
        if (b.dataset.k === 'in') { var x = state.incomes.filter(function (v) { return v.id === id; })[0]; if (x) openSheet('income', { id: x.id, amount: R.toInput(x.amount), desc: x.desc, date: x.date }); }
        else { var y = state.savings.filter(function (v) { return v.id === id; })[0]; if (y) openSheet('saving', { id: y.id, amount: R.toInput(y.amount), dest: y.dest || 'viagem', desc: y.desc || '', date: y.date }); }
        break;
      }
      case 'editGoal': {
        var s = state.settings;
        openSheet('goal', { goalName: gname(), goalType: gtype(), ticketsGoal: R.toInput(s.ticketsGoal), spendGoal: R.toInput(s.spendGoal), ticketsDeadline: s.ticketsDeadline, finalDeadline: s.finalDeadline, monthlyGoal: R.toInput(s.monthlyGoal), startMonth: s.startMonth }); break;
      }
      case 'monthAdj': {
        var M = b.dataset.m, p = state.plan[M] || {};
        ui.month = M;
        openSheet('monthadj', { M: M, salary: p.salary != null ? R.toInput(p.salary) : '', goal: p.goal != null ? R.toInput(p.goal) : '' }); break;
      }
      case 'set': collect(); d[b.dataset.k] = b.dataset.v; renderSheet(); break;
      case 'flip': collect(); d[b.dataset.k] = !d[b.dataset.k]; d.moreOpen = true; renderSheet(); break;
      case 'fillAmount': collect(); d.amount = b.dataset.v; renderSheet(); break;
      case 'saveExpense': saveExpense(); break;
      case 'saveIncome': saveIncome(); break;
      case 'saveSaving': saveSaving(); break;
      case 'saveGoal': saveGoal(); break;
      case 'editGoalTotal': openSheet('goaltotal', { total: R.toInput(R.tripStats(state, today()).goal), focus: 'total' }); break;
      case 'saveGoalTotal': saveGoalTotal(); break;
      case 'saveMonthAdj': saveMonthAdj(); break;
      case 'delAsk': collect(); d.confirmDel = true; renderSheet(); break;
      case 'delDo': {
        var k = ui.sheet.kind, label = '';
        if (k === 'expense') { R.removeById(state.expenses, d.id); label = d.recId ? 'Voltou ao valor previsto' : 'Despesa excluída'; }
        else if (k === 'income') { R.removeById(state.incomes, d.id); label = 'Recebimento excluído'; }
        else { R.removeById(state.savings, d.id); label = 'Economia excluída'; }
        save(); closeSheet(); fixMonth(); renderAll(); toast(label); break;
      }
      case 'toggleRec': {
        var r = state.recurring.filter(function (v) { return v.id === id; })[0];
        if (r) { r[b.dataset.k] = !r[b.dataset.k]; save(); renderAll(); toast(b.dataset.k === 'active' ? (r.active ? r.name + ' entrou no orçamento' : r.name + ' saiu do orçamento') : (r.confirmed ? 'Valor confirmado' : 'Marcado como estimativa')); }
        break;
      }
      case 'delRec': {
        if (b.dataset.armed === '1') { R.removeById(state.recurring, id); save(); renderAll(); toast('Despesa fixa excluída'); }
        else { b.dataset.armed = '1'; b.textContent = 'Confirmar'; }
        break;
      }
      case 'addCat': {
        var inpEl = $('#newCat'), nm = (inpEl.value || '').trim();
        if (!nm) { toast('Digite o nome da categoria'); break; }
        if (state.cats.some(function (c) { return c.toLowerCase() === nm.toLowerCase(); })) { toast('Essa categoria já existe'); break; }
        state.cats.push(nm); save(); renderAll(); toast('Categoria criada'); break;
      }
      case 'delCat': state.cats = state.cats.filter(function (c) { return c !== b.dataset.c; }); save(); renderAll(); toast('Categoria excluída'); break;
      case 'backup': openSheet('backup', { backup: JSON.stringify(state) }); break;
      case 'copyBackup': {
        collect(); var txt = d.backup;
        var ta = $('#f_backup');
        var done = function () { toast('Backup copiado'); };
        var fallback = function () { if (ta) { ta.focus(); ta.select(); } toast('Selecione o texto e copie'); };
        try { navigator.clipboard.writeText(txt).then(done, fallback); } catch (e) { fallback(); }
        break;
      }
      case 'restore': {
        collect();
        var parsed = null;
        try { parsed = JSON.parse(d.backup); } catch (e) { parsed = null; }
        if (!parsed || typeof parsed !== 'object' || !parsed.settings || !Array.isArray(parsed.expenses)) { d.confirmRestore = false; renderSheet(); return sheetErr('Esse texto não parece um backup válido.'); }
        if (!d.confirmRestore) { d.confirmRestore = true; renderSheet(); break; }
        state = R.migrate(parsed); save(); closeSheet(); fixMonth(); renderAll(); toast('Dados restaurados'); break;
      }
      case 'rtOn': {
        var u = normUrl(($('#rtUrl') || {}).value);
        var cand = { url: u, room: newRoom() };
        if (!rtOk(cand)) { toast('Endereço inválido. Copie de novo do Firebase'); break; }
        rt = cand; rtSave(); rtStart(); renderAll(); openSheet('invite'); break;
      }
      case 'rtInvite': openSheet('invite'); break;
      case 'copyInvite': {
        var inv = $('#f_invite'), link = rt ? rtLink() : '';
        var okc = function () { toast('Link copiado'); };
        var fbk = function () { if (inv) { inv.focus(); inv.select(); } toast('Selecione o link e copie'); };
        try { navigator.clipboard.writeText(link).then(okc, fbk); } catch (e) { fbk(); }
        break;
      }
      case 'rtOff': {
        if (b.dataset.armed === '1') { rtStop(); renderAll(); toast('Sincronização desligada. Os dados ficam neste aparelho'); }
        else { b.dataset.armed = '1'; b.textContent = 'Toque de novo para desligar'; }
        break;
      }
      case 'askSend': sendAsk(($('#askInput') || {}).value); break;
      case 'askChip': sendAsk(b.dataset.q); break;
      case 'askClear': ui.chat = []; renderView(); break;
      case 'tourStart': tourStart(); break;
      case 'tourPrev': if (tour && tour.i > 0) { tour.i--; tourShow(); } break;
      case 'tourSkip': tourEnd(); break;
      case 'tourNext':
        if (!tour) break;
        if (tour.i >= TOUR.length - 1) { tourEnd(); ui.tab = 'chile'; renderAll(); window.scrollTo(0, 0); act('editGoal', b); }
        else { tour.i++; tourShow(); }
        break;
      case 'reset': openSheet('reset'); break;
      case 'resetDo': state = R.defaultState(); try { localStorage.removeItem(KEY); } catch (e) { /* ok */ } save(); closeSheet(); ui.month = initialMonth(); renderAll(); toast('Dados apagados'); break;
    }
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (b) act(b.dataset.act, b);
  });
  document.addEventListener('change', function (e) {
    var t = e.target, key = t.dataset && t.dataset.set; if (!key) return;
    var s = state.settings, v;
    if (key.indexOf('rec:') === 0) {
      var p = key.split(':'), r = state.recurring.filter(function (x) { return x.id === p[1]; })[0];
      v = R.parseBR(t.value);
      if (!r || isNaN(v) || v < 0) { toast('Valor inválido'); renderAll(); return; }
      r.amount = R.r2(v);
    } else {
      v = R.parseBR(t.value);
      if (isNaN(v) || v < 0) { toast('Valor inválido'); renderAll(); return; }
      if (key === 'days') { if (v > 7) { toast('Use de 0 a 7 dias por semana'); renderAll(); return; } s.days = Math.round(v); }
      else if (key === 'weeks') { if (v > 6) { toast('Use no máximo 6 semanas por mês'); renderAll(); return; } s.weeks = v; }
      else s[key] = R.r2(v);
    }
    save(); renderAll(); toast('Atualizado e recalculado');
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && ui.sheet) closeSheet();
    if (e.key === 'Enter' && e.target && e.target.id === 'askInput') { e.preventDefault(); sendAsk(e.target.value); }
  });
  document.addEventListener('input', function (e) { if (e.target && e.target.id === 'askInput') ui.draft = e.target.value; });
  $('#scrim').addEventListener('click', closeSheet);
  $('#fab').addEventListener('click', function () { act('newExpense', $('#fab')); });

  /* ================= sincronização entre aparelhos (Firebase Realtime Database via REST) ================= */
  var RTKEY = 'rumo-ao-chile:rt';
  var COLLS = ['settings', 'plan', 'cats', 'expenses', 'incomes', 'savings', 'recurring'];
  var rt = null, rtSynced = null, rtFirst = true, rtBusy = false, rtAgain = false, rtTimer = null, rtES = null, rtDefer = false, rtPoll = null;

  function normUrl(u) { try { return new URL(String(u || '').trim()).origin; } catch (e) { return ''; } }
  function rtOk(c) {
    return !!c && typeof c.url === 'string' && typeof c.room === 'string' &&
      (/^https:\/\/[a-z0-9-]+(\.[a-z0-9-]+)*\.(firebaseio\.com|firebasedatabase\.app)$/i.test(c.url) || /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(c.url)) &&
      /^[A-Za-z0-9_-]{12,64}$/.test(c.room);
  }
  function rtSave() { try { if (rt) localStorage.setItem(RTKEY, JSON.stringify(rt)); else localStorage.removeItem(RTKEY); } catch (e) { /* ok */ } }
  function newRoom() {
    var a = new Uint8Array(18), c = window.crypto;
    if (c && c.getRandomValues) c.getRandomValues(a); else for (var i = 0; i < a.length; i++) a[i] = Math.floor(Math.random() * 256);
    return Array.prototype.map.call(a, function (v) { return ('0' + v.toString(36)).slice(-2); }).join('');
  }
  function rtLink() { return location.origin + location.pathname + '#u=' + encodeURIComponent(rt.url) + '&r=' + rt.room; }
  function rtBase() { return rt.url + '/rooms/' + rt.room; }
  function j(x) { return x === undefined ? undefined : JSON.parse(JSON.stringify(x)); }
  function canon(v) {
    if (v === null || typeof v !== 'object') return JSON.stringify(v);
    if (Array.isArray(v)) return '[' + v.map(canon).join(',') + ']';
    return '{' + Object.keys(v).sort().map(function (k) { return JSON.stringify(k) + ':' + canon(v[k]); }).join(',') + '}';
  }
  function ckey(n) { return encodeURIComponent(n).replace(/\./g, '%2E'); }
  function persistLocal() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ok */ } }

  function toShape(S) {
    var o = { settings: {}, plan: {}, cats: {}, expenses: {}, incomes: {}, savings: {}, recurring: {} };
    Object.keys(S.settings).forEach(function (k) { o.settings[k] = S.settings[k]; });
    Object.keys(S.plan).forEach(function (k) { o.plan[k] = S.plan[k]; });
    S.cats.forEach(function (c) { o.cats[ckey(c)] = c; });
    ['expenses', 'incomes', 'savings', 'recurring'].forEach(function (c) { S[c].forEach(function (x) { o[c][x.id] = x; }); });
    return o;
  }
  function applyShape(F) {
    var d = R.defaultState();
    state.settings = Object.assign({}, d.settings, F.settings);
    state.plan = F.plan;
    var names = Object.keys(F.cats).map(function (k) { return F.cats[k]; });
    var keep = state.cats.filter(function (c) { return names.indexOf(c) >= 0; });
    names.forEach(function (c) { if (keep.indexOf(c) < 0) keep.push(c); });
    if (keep.indexOf(R.FUND_CAT) < 0) keep.push(R.FUND_CAT);
    state.cats = keep;
    ['expenses', 'incomes', 'savings', 'recurring'].forEach(function (c) {
      var m = F[c], seen = {}, arr = [];
      state[c].forEach(function (x) { if (m[x.id]) { arr.push(m[x.id]); seen[x.id] = 1; } });
      Object.keys(m).sort().forEach(function (id) { if (!seen[id]) arr.push(m[id]); });
      state[c] = arr;
    });
  }

  function rtFetch(path, opt) {
    var ctl = new AbortController(), to = setTimeout(function () { ctl.abort(); }, 12000);
    opt = opt || {}; opt.signal = ctl.signal; opt.cache = 'no-store';
    return fetch(rtBase() + path + '.json', opt).then(function (r) {
      clearTimeout(to);
      if (!r.ok) throw new Error('http ' + r.status);
      return r.json();
    }, function (e) { clearTimeout(to); throw e; });
  }
  function rtSchedule(ms) { if (!rt) return; clearTimeout(rtTimer); rtTimer = setTimeout(rtSync, ms == null ? 400 : ms); }

  function rtSync() {
    if (!rt) return Promise.resolve();
    if (rtBusy) { rtAgain = true; return Promise.resolve(); }
    rtBusy = true;
    var room = rt.room;
    return rtFetch('').then(function (raw) {
      if (!rt || rt.room !== room) return;
      var Rm = raw && typeof raw === 'object' ? raw : {}, remote = {};
      COLLS.forEach(function (c) { remote[c] = Rm[c] && typeof Rm[c] === 'object' ? Rm[c] : {}; });
      var local = j(toShape(state));
      if (rtFirst || !rtSynced) {
        // primeira vez neste aparelho: o que já existe na nuvem vale; o que só existe aqui é enviado
        rtSynced = {};
        COLLS.forEach(function (c) { rtSynced[c] = {}; Object.keys(remote[c]).forEach(function (k) { if (k in local[c]) rtSynced[c][k] = local[c][k]; }); });
        rtFirst = false;
      }
      var final = {}, push = {};
      COLLS.forEach(function (c) {
        var L = local[c], S = rtSynced[c] || {}, Rr = remote[c], p = {}, f = j(Rr);
        Object.keys(L).forEach(function (k) { if (!(k in S) || canon(L[k]) !== canon(S[k])) p[k] = L[k]; });
        Object.keys(S).forEach(function (k) { if (!(k in L)) p[k] = null; });
        Object.keys(p).forEach(function (k) {
          if (p[k] === null) delete f[k]; else f[k] = p[k];
          var rv = (k in Rr) ? canon(Rr[k]) : null, pv = p[k] === null ? null : canon(p[k]);
          if (rv !== pv) push[c + '/' + k] = p[k];
        });
        final[c] = f;
      });
      if (canon(local) !== canon(final)) { applyShape(final); persistLocal(); rtRenderSoon(); }
      var keys = Object.keys(push);
      var done = keys.length ? rtFetch('', { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(push) }) : Promise.resolve();
      return done.then(function () {
        var ns = {};
        COLLS.forEach(function (c) { ns[c] = j(remote[c]); });
        keys.forEach(function (k) { var i = k.indexOf('/'), c = k.slice(0, i), id = k.slice(i + 1); if (push[k] === null) delete ns[c][id]; else ns[c][id] = push[k]; });
        rtSynced = ns;
        try { localStorage.setItem('rumo-ao-chile:rt-synced:' + room, JSON.stringify(ns)); } catch (e) { /* ok */ }
        setSync('rt-live');
      });
    }).catch(function (e) {
      setSync(/http 40[13]/.test(String(e && e.message)) ? 'rt-denied' : 'rt-offline');
      rtSchedule(12000);
    }).then(function () {
      rtBusy = false;
      if (rtAgain) { rtAgain = false; rtSchedule(150); }
    });
  }

  function rtListen() {
    if (rtES) { try { rtES.close(); } catch (e) { /* ok */ } rtES = null; }
    if (!rt || typeof EventSource === 'undefined') return;
    try {
      rtES = new EventSource(rtBase() + '.json');
      var h = function () { rtSchedule(250); };
      rtES.addEventListener('put', h); rtES.addEventListener('patch', h);
    } catch (e) { rtES = null; }
  }
  function rtStart() {
    if (!rt) return;
    var s = null;
    try { s = JSON.parse(localStorage.getItem('rumo-ao-chile:rt-synced:' + rt.room) || 'null'); } catch (e) { s = null; }
    if (s && typeof s === 'object') { rtSynced = s; rtFirst = false; } else { rtSynced = null; rtFirst = true; }
    setSync('rt-connecting'); rtListen(); rtSchedule(0);
    clearInterval(rtPoll);
    rtPoll = setInterval(function () { if (!document.hidden) rtSchedule(0); }, 30000);
  }
  function rtStop() {
    if (rtES) { try { rtES.close(); } catch (e) { /* ok */ } rtES = null; }
    clearInterval(rtPoll); clearTimeout(rtTimer);
    try { if (rt) localStorage.removeItem('rumo-ao-chile:rt-synced:' + rt.room); } catch (e) { /* ok */ }
    rt = null; rtSynced = null; rtSave(); setSync('local');
  }
  function rtRenderSoon() {
    var a = document.activeElement;
    if (a && a.closest && a.closest('#view') && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) { rtDefer = true; return; }
    fixMonth(); renderTop(); renderView(); renderNav();
  }
  document.addEventListener('focusout', function () {
    if (!rtDefer) return;
    setTimeout(function () {
      var a = document.activeElement;
      if (a && a.closest && a.closest('#view') && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
      rtDefer = false; fixMonth(); renderTop(); renderView(); renderNav();
    }, 60);
  });
  window.addEventListener('online', function () { rtSchedule(0); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) rtSchedule(0); });

  function rtCard() {
    if (rt) {
      return '<section class="card"><h2>Sincronização entre aparelhos</h2>' + syncLine() +
        '<p class="hint" style="margin:10px 0 12px">Tudo o que você registra aparece nos outros aparelhos que abrirem o seu link, em poucos segundos. Quem tiver o link vê e edita os mesmos dados.</p>' +
        '<div class="btn-row"><button class="btn primary" data-act="rtInvite">Link de convite</button><button class="btn ghost" data-act="rtOff">Desligar</button></div></section>';
    }
    return '<section class="card"><h2>Sincronização entre aparelhos</h2>' +
      '<p class="hint" style="margin:0 0 12px">Opcional. Cole o endereço do seu banco de dados do Firebase para os aparelhos mostrarem sempre os mesmos dados.</p>' +
      '<div class="field"><label for="rtUrl">Endereço do banco de dados</label><input class="inp" id="rtUrl" inputmode="url" autocomplete="off" autocapitalize="off" placeholder="https://seu-projeto-default-rtdb.firebaseio.com"></div>' +
      '<button class="btn primary block" style="margin-top:12px" data-act="rtOn">Ligar sincronização</button></section>';
  }

  (function readInvite() {
    var h = location.hash || '';
    if (h.indexOf('u=') < 0 || h.indexOf('r=') < 0) return;
    var p = new URLSearchParams(h.replace(/^#/, ''));
    var c = { url: normUrl(p.get('u')), room: p.get('r') || '' };
    if (rtOk(c)) { rt = c; rtSave(); }
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* ok */ }
  })();
  try { var rtRaw = JSON.parse(localStorage.getItem(RTKEY) || 'null'); if (!rt && rtOk(rtRaw)) rt = rtRaw; } catch (e) { /* ok */ }

  renderAll();
  if (rt) rtStart(); else initCloud();
  if (state.updated === 0 && !tourSeen()) setTimeout(tourStart, 500);
})();

</script>
